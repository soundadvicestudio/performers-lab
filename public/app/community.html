<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
    --green: #4caf84; --green-dim: rgba(76,175,132,0.12);
    --red: #e05c5c; --red-dim: rgba(224,92,92,0.08); --red-border: rgba(224,92,92,0.25);
    --btn-bg-dim: rgba(7,7,7,0.3);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LAYOUT ── */
  .community-layout {
    display: flex;
    min-height: calc(100vh - 56px - 42px);
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem;
    gap: 0;
  }

  /* ── CHANNEL SIDEBAR ── */
  .channel-sidebar {
    width: 230px;
    flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    padding: 1.5rem 0;
    position: sticky;
    top: 98px; /* nav 56px + subnav 42px */
    height: calc(100vh - 98px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .channel-sidebar::-webkit-scrollbar { width: 4px; }
  .channel-sidebar::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }

  .sidebar-toggle {
    display: none;
    align-items: center; gap: 8px;
    padding: 10px 1rem;
    background: var(--bg-2); border: 0.5px solid var(--border);
    border-radius: 4px; margin: 1rem 0 0.5rem;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); cursor: pointer; width: 100%;
  }
  .sidebar-toggle:hover { color: var(--gold); border-color: var(--border-gold); }
  .sidebar-toggle svg { flex-shrink: 0; }

  .sidebar-section { margin-bottom: 1.5rem; }
  .sidebar-category {
    font-size: 9px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--text-dim); padding: 0 1rem 0.5rem;
  }

  .channel-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 1rem; cursor: pointer;
    font-size: 13px; font-weight: 400; color: var(--text-muted);
    border-left: 3px solid transparent;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .channel-item:hover { color: var(--text); background: rgba(240,237,230,0.03); }
  .channel-item.active { color: var(--gold); border-left-color: var(--gold); font-weight: 500; background: var(--gold-dim); }
  .channel-item-name { display: flex; align-items: center; gap: 6px; }
  .channel-hash { color: var(--text-dim); font-size: 14px; line-height: 1; }
  .channel-item.active .channel-hash { color: var(--gold); opacity: 0.7; }
  .unread-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); flex-shrink: 0;
  }

  /* ── MAIN FEED ── */
  .feed-area {
    flex: 1;
    min-width: 0;
    padding: 1.5rem 0 2rem 1.5rem;
  }

  .feed-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 1.25rem;
  }
  .feed-header-hash { font-size: 20px; color: var(--text-dim); line-height: 1; }
  .feed-header-name {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400;
    color: var(--text); letter-spacing: 0.02em;
  }

  /* ── COMPOSER ── */
  .composer-card {
    background: var(--bg-2); border: 0.5px solid var(--border-gold);
    border-radius: 8px; padding: 16px; margin-bottom: 1.25rem;
    position: relative;
  }
  .composer-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    border-radius: 8px 8px 0 0;
  }

  /* Quill dark theme overrides */
  .ql-snow .ql-toolbar {
    background: var(--bg-3) !important;
    border: 0.5px solid var(--border) !important;
    border-bottom: none !important;
    border-radius: 4px 4px 0 0;
  }
  .ql-snow .ql-container {
    background: var(--bg-3) !important;
    border: 0.5px solid var(--border) !important;
    border-top: none !important;
    border-radius: 0 0 4px 4px;
    font-family: 'Raleway', sans-serif !important;
    font-size: 14px !important;
    color: var(--text) !important;
    min-height: 80px;
  }
  .ql-snow .ql-container:focus-within {
    border-color: var(--border-gold) !important;
  }
  .ql-snow .ql-toolbar:has(+ .ql-container:focus-within) {
    border-color: var(--border-gold) !important;
  }
  .ql-editor { min-height: 80px; }
  .ql-editor.ql-blank::before {
    color: var(--text-dim) !important;
    font-style: normal !important;
    font-family: 'Raleway', sans-serif !important;
  }
  .ql-snow .ql-stroke { stroke: var(--text-dim) !important; }
  .ql-snow .ql-fill { fill: var(--text-dim) !important; }
  .ql-snow .ql-picker { color: var(--text-dim) !important; }
  .ql-snow .ql-toolbar button:hover .ql-stroke,
  .ql-snow .ql-toolbar button.ql-active .ql-stroke { stroke: var(--gold) !important; }
  .ql-snow .ql-toolbar button:hover .ql-fill,
  .ql-snow .ql-toolbar button.ql-active .ql-fill { fill: var(--gold) !important; }
  .ql-snow a { color: var(--gold) !important; }
  .ql-editor p, .ql-editor li { color: var(--text); }

  .composer-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }
  .composer-error { font-size: 12px; color: var(--red); }
  .btn-post {
    background: var(--gold); color: var(--bg);
    border: none; padding: 9px 22px; border-radius: 2px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    cursor: pointer; font-family: 'Raleway', sans-serif;
    transition: background 0.2s, opacity 0.2s; display: flex; align-items: center; gap: 8px;
  }
  .btn-post:hover:not(:disabled) { background: var(--gold-light); }
  .btn-post:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--btn-bg-dim); border-top-color: var(--bg);
    border-radius: 50%; animation: spin 0.7s linear infinite;
  }

  /* ── POST CARDS ── */
  #feed-list { display: flex; flex-direction: column; gap: 1rem; }

  .post-card {
    background: var(--bg-2); border: 0.5px solid var(--border);
    border-radius: 8px; padding: 18px 20px;
    transition: border-color 0.2s;
  }
  .post-card:hover { border-color: var(--border-mid); }

  .post-pin-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); background: var(--gold-dim); border: 0.5px solid var(--border-gold);
    padding: 3px 8px; border-radius: 2px; margin-bottom: 10px;
  }

  .post-meta {
    display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
  }
  .post-avatar {
    width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--gold); font-family: 'Raleway', sans-serif;
    overflow: hidden;
  }
  .post-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .post-author-info { display: flex; flex-direction: column; gap: 2px; }
  .post-author { font-size: 13px; font-weight: 600; color: var(--gold); }
  .post-time { font-size: 11px; color: var(--text-dim); }

  .post-body {
    font-size: 14px; color: var(--text); line-height: 1.65;
    margin-bottom: 14px; word-break: break-word;
  }
  .post-body p { margin-bottom: 0.5em; }
  .post-body p:last-child { margin-bottom: 0; }
  .post-body a { color: var(--gold); text-decoration: underline; }
  .post-body ul, .post-body ol { padding-left: 1.4em; margin-bottom: 0.5em; }
  .post-body li { margin-bottom: 0.2em; }
  .post-body strong { font-weight: 700; }
  .post-body em { font-style: italic; }

  .post-actions {
    display: flex; align-items: center; gap: 16px;
    padding-top: 12px; border-top: 0.5px solid var(--border);
  }

  .reaction-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 0.5px solid var(--border);
    border-radius: 20px; padding: 5px 12px;
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; font-family: 'Raleway', sans-serif;
    transition: all 0.15s;
  }
  .reaction-btn:hover { border-color: var(--border-gold); color: var(--gold); }
  .reaction-btn.reacted {
    border-color: var(--border-gold); color: var(--gold);
    background: var(--gold-dim);
  }
  .reaction-count { font-size: 12px; font-weight: 600; min-width: 10px; }

  .comment-toggle-btn {
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: var(--text-dim); font-family: 'Raleway', sans-serif;
    font-weight: 500; letter-spacing: 0.04em; transition: color 0.15s;
    padding: 0;
  }
  .comment-toggle-btn:hover { color: var(--text-muted); }

  /* ── COMMENT THREAD ── */
  .comment-thread {
    margin-top: 14px; padding-top: 14px;
    border-top: 0.5px solid var(--border);
    display: none;
  }
  .comment-thread.open { display: block; }

  .comment-item {
    display: flex; gap: 10px; margin-bottom: 12px;
  }
  .comment-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--gold); font-family: 'Raleway', sans-serif;
    overflow: hidden;
  }
  .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .comment-body { flex: 1; min-width: 0; }
  .comment-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .comment-author { font-size: 12px; font-weight: 600; color: var(--gold); }
  .comment-time { font-size: 10px; color: var(--text-dim); }
  .comment-text { font-size: 13px; color: var(--text); line-height: 1.55; word-break: break-word; }

  .comment-composer {
    display: flex; gap: 10px; margin-top: 10px; align-items: flex-start;
  }
  .comment-input {
    flex: 1; background: var(--bg-3); border: 0.5px solid var(--border);
    border-radius: 4px; padding: 8px 12px;
    font-size: 13px; color: var(--text); font-family: 'Raleway', sans-serif;
    resize: none; height: 38px; overflow: hidden;
    transition: border-color 0.2s; line-height: 1.5;
  }
  .comment-input::placeholder { color: var(--text-dim); }
  .comment-input:focus { outline: none; border-color: var(--border-gold); }
  .btn-comment {
    background: var(--gold); color: var(--bg); border: none;
    padding: 8px 14px; border-radius: 2px; flex-shrink: 0;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; font-family: 'Raleway', sans-serif; transition: background 0.2s;
    white-space: nowrap;
  }
  .btn-comment:hover:not(:disabled) { background: var(--gold-light); }
  .btn-comment:disabled { opacity: 0.5; cursor: not-allowed; }

  .comments-loading { font-size: 12px; color: var(--text-dim); font-style: italic; padding: 4px 0; }
  .no-comments { font-size: 12px; color: var(--text-dim); font-style: italic; padding: 4px 0; }

  /* ── FEED STATES ── */
  .feed-loading {
    text-align: center; padding: 3rem 1rem;
    font-size: 13px; color: var(--text-dim); font-style: italic;
  }
  .feed-empty {
    text-align: center; padding: 3rem 1rem;
    font-size: 14px; color: var(--text-dim);
    border: 0.5px dashed var(--border); border-radius: 8px;
  }
  .feed-empty strong { color: var(--text-muted); display: block; margin-bottom: 6px; font-size: 15px; }
  .feed-error {
    background: var(--red-dim); border: 0.5px solid var(--red-border);
    border-radius: 6px; padding: 14px 16px;
    font-size: 13px; color: var(--red);
  }

  /* ── MOBILE SIDEBAR TOGGLE ── */
  @media (max-width: 768px) {
    .community-layout { padding: 0 1rem; flex-direction: column; gap: 0; }
    .channel-sidebar {
      width: 100%; position: static; height: auto;
      border-right: none; border-bottom: 0.5px solid var(--border);
      padding: 0;
    }
    .sidebar-toggle { display: flex; }
    .sidebar-channels { display: none; padding-bottom: 0.5rem; }
    .sidebar-channels.open { display: block; }
    .feed-area { padding: 1.25rem 0 2rem; }
  }
  @media (max-width: 600px) {
    .feed-area { padding: 1rem 0 1.5rem; }
  }

  /* ── AUTHOR LINKS ── */
  a.author-link {
    color: var(--gold); text-decoration: none;
  }
  a.author-link:hover { text-decoration: underline; }

  /* ── REACTION TOOLTIP ── */
  .reaction-wrapper { position: relative; display: inline-flex; }

  .clapper-tooltip {
    display: none;
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-2);
    border: 1px solid var(--border-gold);
    border-radius: 8px;
    padding: 8px 12px;
    min-width: 120px;
    max-height: 150px;
    overflow-y: auto;
    z-index: 60;
    white-space: nowrap;
    scrollbar-width: thin;
    scrollbar-color: var(--border-mid) transparent;
  }
  .clapper-tooltip.visible { display: block; }
  /* border triangle */
  .clapper-tooltip::after {
    content: '';
    position: absolute;
    top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 7px solid transparent;
    border-top-color: var(--border-gold);
  }
  /* fill triangle */
  .clapper-tooltip::before {
    content: '';
    position: absolute;
    top: calc(100% - 1px); left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top-color: var(--bg-2);
    z-index: 1;
  }
  .clapper-name { font-size: 13px; color: var(--text); display: block; padding: 2px 0; }
  .clapper-empty { font-size: 12px; color: var(--text-dim); font-style: italic; display: block; }

  /* ── VIDEO BADGE ── */
  .video-badge {
    display: inline-flex; align-items: center;
    background: var(--gold-dim); color: var(--gold);
    font-size: 0.7rem; font-weight: 600; font-family: 'Raleway', sans-serif;
    padding: 2px 7px; border-radius: 10px; border: 0.5px solid var(--border-gold);
    letter-spacing: 0.05em; flex-shrink: 0;
  }

  /* ── VIEW ALL COMMENTS ── */
  .view-all-link {
    display: block; font-size: 12px; color: var(--text-muted);
    font-family: 'Raleway', sans-serif; font-weight: 400;
    text-decoration: none; margin: 8px 0 10px;
    transition: color 0.15s;
  }
  .view-all-link:hover { color: var(--gold); }

  /* ── VIDEO COMPOSER ── */
  .btn-add-video {
    background: var(--bg-3); border: 0.5px solid var(--border);
    color: var(--text-muted); padding: 6px 14px; border-radius: 3px;
    font-size: 12px; font-weight: 500; font-family: 'Raleway', sans-serif;
    cursor: pointer; transition: all 0.2s; margin-top: 8px;
  }
  .btn-add-video:hover { border-color: var(--border-gold); color: var(--gold); }
  .btn-add-video.has-video { color: var(--gold); border-color: var(--border-gold); background: var(--gold-dim); }
  .video-input-panel { display: none; margin-top: 8px; }
  .video-url-input {
    width: 100%; background: var(--bg-3); border: 0.5px solid var(--border-mid);
    color: var(--text); padding: 8px 12px; border-radius: 3px;
    font-size: 13px; font-family: 'Raleway', sans-serif;
    outline: none; transition: border-color 0.2s;
  }
  .video-url-input:focus { border-color: var(--border-gold); background: var(--bg-4); }
  .video-url-input::placeholder { color: var(--text-dim); }
  .btn-remove-video {
    background: none; border: none; cursor: pointer;
    font-size: 12px; color: var(--text-muted); font-family: 'Raleway', sans-serif;
    transition: color 0.15s; padding: 0; margin-top: 5px;
  }
  .btn-remove-video:hover { color: var(--text); }
  .video-validation-msg { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }

  /* ── MENTION CHIPS ── */
  .mention-chip {
    display: inline-block; background: var(--gold-dim); color: var(--gold);
    border-radius: 4px; padding: 0 5px; font-size: 0.92em; font-weight: 600;
    cursor: pointer; user-select: none; text-decoration: none;
  }
  .mention-chip:hover { background: var(--border-gold); }

  /* ── MENTION DROPDOWN ── */
  #mention-dropdown {
    position: absolute; background: var(--bg-2); border: 1px solid var(--border-gold);
    border-radius: 8px; min-width: 220px; max-height: 200px; overflow-y: auto;
    z-index: 1000; display: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .mention-option {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    cursor: pointer; font-family: 'Raleway', sans-serif; font-size: 0.88rem; color: var(--text);
  }
  .mention-option:hover, .mention-option.active { background: var(--gold-dim); }
  .mention-option img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .mention-option-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--gold); font-family: 'Raleway', sans-serif;
  }
  .mention-option-name { color: var(--text); }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <div class="community-layout">

    <!-- Channel sidebar -->
    <aside class="channel-sidebar" id="channel-sidebar">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Channels
        <svg id="sidebar-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="sidebar-channels" id="sidebar-channels">
        <div id="channel-list">
          <div class="sidebar-section">
            <div class="channel-item active" data-channel-id="" id="channel-main-feed">
              <span class="channel-item-name">
                <span style="font-size:16px;line-height:1">🏠</span>
                Main Feed
              </span>
            </div>
          </div>
          <div id="channel-groups"></div>
        </div>
      </div>
    </aside>

    <!-- Feed area -->
    <main class="feed-area">
      <div class="feed-header">
        <span class="feed-header-hash" id="feed-header-hash">#</span>
        <span class="feed-header-name" id="feed-header-name">Main Feed</span>
      </div>

      <!-- Composer -->
      <div class="composer-card" id="composer">
        <div id="quill-editor"></div>
        <button type="button" id="btn-add-video" class="btn-add-video">▶ Add Video</button>
        <div id="video-input-panel" class="video-input-panel">
          <input type="text" id="video-url-input" class="video-url-input" placeholder="Paste a YouTube or Google Drive URL" autocomplete="off">

  // ── State ──────────────────────────────────────────────────────────────

  // ── Helpers ────────────────────────────────────────────────────────────
  function sanitizeHTML(html) {
    const ALLOWED = new Set(['b','i','u','strong','em','a','ul','ol','li','p','br','span']);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    function clean(node) {
      const toUnwrap = [];
      for (const child of [...node.childNodes]) {
        if (child.nodeType !== Node.ELEMENT_NODE) continue;
        const tag = child.tagName.toLowerCase();
        if (!ALLOWED.has(tag)) { toUnwrap.push(child); continue; }
        if (tag === 'span') {
          // Allow only mention chip spans with required data attrs
          if (child.classList.contains('mention-chip') && child.dataset.userId && child.dataset.displayName) {
            for (const attr of [...child.attributes]) {
              if (!['class','data-user-id','data-display-name','contenteditable'].includes(attr.name)) {
                child.removeAttribute(attr.name);
              }
            }
          } else {
            toUnwrap.push(child);
            continue;
          }
        } else {
          // Strip all attributes; allow href on <a> with safe protocol only
          for (const attr of [...child.attributes]) {
            if (tag === 'a' && attr.name === 'href' && /^(https?:|\/|#)/.test(attr.value)) continue;
            child.removeAttribute(attr.name);
          }
        }
        clean(child);
      }
      for (const el of toUnwrap) {
        while (el.firstChild) node.insertBefore(el.firstChild, el);
        node.removeChild(el);
      }
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getInitial(name) {
    return String(name || '?').charAt(0).toUpperCase();
  }

  function avatarEl(photoUrl, name, size = 36) {
    const px = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;`;
    if (photoUrl) {
      return `<div class="post-avatar" style="${size !== 36 ? px : ''}">`
        + `<img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(name)}" loading="lazy">`
        + `</div>`;
    }
    return `<div class="post-avatar" style="${size !== 36 ? px : ''}">${escapeHtml(getInitial(name))}</div>`;
  }

  function commentAvatarEl(photoUrl, name) {
    if (photoUrl) {
      return `<div class="comment-avatar"><img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(name)}" loading="lazy"></div>`;
    }
    return `<div class="comment-avatar">${escapeHtml(getInitial(name))}</div>`;
  }

  function stripHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
  }

  // ── Mention helpers ────────────────────────────────────────────────────
  function buildDisplayNameMap(profileMap) {
    const map = {};
    Object.values(profileMap).forEach(p => { if (p.display_name) map[p.display_name] = p; });
    return map;
  }

  function convertMentions(text, displayNameMap) {
    if (!text) return '';
    const escaped = escapeHtml(text);
    if (!Object.keys(displayNameMap).length) return escaped;
    return escaped.replace(/@([^\s@]+(?:\s[^\s@]+)*)/g, (match, name) => {
      const profile = displayNameMap[name];
      if (profile) {
        return `<span class="mention-chip" data-user-id="${escapeHtml(profile.user_id)}" data-display-name="${escapeHtml(name)}">${escapeHtml(match)}</span>`;
      }
      return match;
    });
  }

  async function getActiveUserIds() {
    if (_activeUserIds !== null) return _activeUserIds;
    const { data } = await supabase.from('memberships').select('user_id').in('status', ['active', 'cancelling']);
    _activeUserIds = (data || []).map(r => r.user_id);
    return _activeUserIds;
  }

  async function searchMembers(query) {
    const activeIds = await getActiveUserIds();
    if (!activeIds.length) return [];
    const { data } = await supabase
      .from('profiles').select('user_id, display_name, photo_url')
      .ilike('display_name', `%${query}%`)
      .in('user_id', activeIds)
      .limit(6);
    return (data || []).map(p => ({ userId: p.user_id, displayName: p.display_name || '', photoUrl: p.photo_url || null }));
  }

  function renderMentionOptions(members) {
    return members.map((m, i) => {
      const avatar = m.photoUrl
        ? `<img src="${escapeHtml(m.photoUrl)}" alt="${escapeHtml(m.displayName)}">`
        : `<div class="mention-option-avatar">${escapeHtml((m.displayName || '?')[0].toUpperCase())}</div>`;
      return `<div class="mention-option${i === 0 ? ' active' : ''}" data-idx="${i}">${avatar}<span class="mention-option-name">${escapeHtml(m.displayName)}</span></div>`;
    }).join('');
  }

  function updateDropdownActive() {
    const dropdown = document.getElementById('mention-dropdown');
    if (!dropdown) return;
    dropdown.querySelectorAll('.mention-option').forEach((opt, i) => {
      opt.classList.toggle('active', i === dropdownActiveIndex);
    });
  }

  function hideMentionDropdown() {
    const dropdown = document.getElementById('mention-dropdown');
    if (dropdown) dropdown.style.display = 'none';
    dropdownMembers = [];
    dropdownActiveIndex = 0;
    activeDropdownContext = null;
    clearTimeout(mentionSearchTimer);
  }

  function showQuillMentionDropdown(query, cursorIndex) {
    activeDropdownContext = 'quill';
    clearTimeout(mentionSearchTimer);
    mentionSearchTimer = setTimeout(async () => {
      const members = await searchMembers(query);
      dropdownMembers = members;
      dropdownActiveIndex = 0;
      const dropdown = document.getElementById('mention-dropdown');
      if (!members.length) { hideMentionDropdown(); return; }
      dropdown.innerHTML = renderMentionOptions(members);
      const bounds = quill.getBounds(cursorIndex);
      const editorRect = quill.container.getBoundingClientRect();
      dropdown.style.left = `${editorRect.left + bounds.left}px`;
      dropdown.style.top = `${editorRect.top + bounds.bottom + window.scrollY + 4}px`;
      dropdown.style.display = 'block';
      dropdown.querySelectorAll('.mention-option').forEach((opt, i) => {
        opt.addEventListener('mousedown', e => { e.preventDefault(); selectMentionOption(members[i]); });
      });
    }, 200);
  }

  function selectMentionOption(member) {
    if (!isAdminOrMod && mentionCount >= 3) {
      const errEl = document.getElementById('composer-error');
      if (errEl) {
        errEl.textContent = 'You can mention up to 3 members per post.';
        setTimeout(() => { errEl.textContent = ''; }, 3000);
      }
      hideMentionDropdown();
      return;
    }
    const sel = quill.getSelection();
    if (!sel) return;
    const cursorIndex = sel.index;
    const textBefore = quill.getText(0, cursorIndex);
    const atMatch = textBefore.match(/(?:^|\s)@([^\s]*)$/);
    if (!atMatch) { hideMentionDropdown(); return; }
    const query = atMatch[1];
    const atCharPos = textBefore.lastIndexOf('@');
    const deleteLength = cursorIndex - atCharPos;
    quill.deleteText(atCharPos, deleteLength);
    quill.insertEmbed(atCharPos, 'mention', { userId: member.userId, displayName: member.displayName });
    quill.insertText(atCharPos + 1, ' ');
    quill.setSelection(atCharPos + 2, 0);
    mentionCount++;
    hideMentionDropdown();
  }

  async function handleCommentMentionInput(textarea, postId) {
    const val = textarea.value;
    const cursor = textarea.selectionStart;
    const textBefore = val.substring(0, cursor);
    const atMatch = textBefore.match(/(?:^|\s)@([^\s]*)$/);
    if (!atMatch) { hideMentionDropdown(); return; }
    const query = atMatch[1];
    activeDropdownContext = { textarea, postId };
    clearTimeout(mentionSearchTimer);
    mentionSearchTimer = setTimeout(async () => {
      const members = await searchMembers(query);
      dropdownMembers = members;
      dropdownActiveIndex = 0;
      const dropdown = document.getElementById('mention-dropdown');
      if (!members.length) { hideMentionDropdown(); return; }
      dropdown.innerHTML = renderMentionOptions(members);
      const rect = textarea.getBoundingClientRect();
      dropdown.style.left = `${rect.left + window.scrollX}px`;
      dropdown.style.top = `${rect.bottom + window.scrollY + 4}px`;
      dropdown.style.display = 'block';
      dropdown.querySelectorAll('.mention-option').forEach((opt, i) => {
        opt.addEventListener('mousedown', e => { e.preventDefault(); selectCommentMentionOption(members[i], textarea, postId); });
      });
    }, 200);
  }

  function selectCommentMentionOption(member, textarea, postId) {
    const mentions = commentMentionsMap[postId] || [];
    if (!isAdminOrMod && mentions.length >= 3) {
      const errEl = document.getElementById(`comment-error-${postId}`);
      if (errEl) {
        errEl.textContent = 'You can mention up to 3 members per comment.';
        errEl.style.display = 'block';
        setTimeout(() => { errEl.style.display = 'none'; errEl.textContent = ''; }, 3000);
      }
      hideMentionDropdown();
      return;
    }
    const val = textarea.value;
    const cursor = textarea.selectionStart;
    const textBefore = val.substring(0, cursor);
    const atMatch = textBefore.match(/(?:^|\s)@([^\s]*)$/);
    if (!atMatch) { hideMentionDropdown(); return; }
    const query = atMatch[1];
    const atPos = textBefore.lastIndexOf('@');
    textarea.value = val.substring(0, atPos) + '@' + member.displayName + val.substring(cursor);
    const newCursor = atPos + 1 + member.displayName.length;
    textarea.setSelectionRange(newCursor, newCursor);
    textarea.focus();
    if (!commentMentionsMap[postId]) commentMentionsMap[postId] = [];
    if (!commentMentionsMap[postId].some(m => m.userId === member.userId)) {
      commentMentionsMap[postId].push({ userId: member.userId, displayName: member.displayName });
    }
    hideMentionDropdown();
  }

  // ── Init ───────────────────────────────────────────────────────────────
  function isProfileComplete(profile) {
    return !!(
      profile?.display_name?.trim() &&
      profile?.birth_year &&
      profile?.experience?.trim() &&
      profile?.location?.trim() &&
      profile?.bio?.trim() &&
      profile?.timezone?.trim()
    );
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }
    currentUser = session.user;

    const [{ data: profile }, { data: membership }] = await Promise.all([
      supabase.from('profiles').select('display_name, photo_url, is_admin, is_moderator, theme, bio, location, birth_year, experience, timezone').eq('user_id', currentUser.id).single(),
      supabase.from('memberships').select('status').eq('user_id', currentUser.id).single(),
    ]);

    if (!profile?.is_admin && !isProfileComplete(profile)) {
      window.location.href = '/app/profile.html?onboarding=true';
      return;
    }

    const hasAccess = profile?.is_admin
      || membership?.status === 'active'
      || membership?.status === 'cancelling';

    if (!hasAccess) { window.location.href = '/app/gate.html'; return; }

    currentUserDisplayName = profile?.display_name || currentUser.email.split('@')[0];
    userTimezone = profile?.timezone || 'America/Chicago';
    isAdminOrMod = !!(profile?.is_admin || profile?.is_moderator);
    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: currentUserDisplayName, isAdmin: profile?.is_admin });
    initSubnav('Community', supabase);
    initFooter();

    initQuill();
    initSidebarToggle();

    await Promise.all([
      loadChannels(),
      loadChannelViews(),
    ]);

    renderSidebar();
    await loadFeed();
    subscribeRealtime();
    subscribeNewPosts();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  // ── Quill ──────────────────────────────────────────────────────────────
  function initQuill() {
    quill = new Quill('#quill-editor', {
      theme: 'snow',
      placeholder: "What's on your mind?",
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          ['link'],
          [{ list: 'ordered' }, { list: 'bullet' }],
        ],
      },
    });

    document.getElementById('btn-post').addEventListener('click', submitPost);
    initVideoComposer();

    // Mention autocomplete on text-change
    quill.on('text-change', () => {
      const sel = quill.getSelection();
      if (!sel) { hideMentionDropdown(); return; }
      const textBefore = quill.getText(0, sel.index);
      const atMatch = textBefore.match(/(?:^|\s)@([^\s]*)$/);
      if (atMatch) {
        showQuillMentionDropdown(atMatch[1], sel.index);
      } else {
        hideMentionDropdown();
      }
    });
  }

  // ── Sidebar toggle (mobile) ────────────────────────────────────────────
  function initSidebarToggle() {
    const btn = document.getElementById('sidebar-toggle');
    const channels = document.getElementById('sidebar-channels');
    const chevron = document.getElementById('sidebar-chevron');

    // On desktop the channels block is always visible
    if (window.innerWidth > 768) {
      channels.classList.add('open');
    }

    btn.addEventListener('click', () => {
      const open = channels.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      chevron.style.transform = open ? 'rotate(180deg)' : '';
    });
  }

  // ── Channels ───────────────────────────────────────────────────────────
  async function loadChannels() {
    const { data } = await supabase
      .from('channels')
      .select('id, name, slug, category, position')
      .eq('archived', false)
      .order('position', { ascending: true });
    channels = data || [];
  }

  async function loadChannelViews() {
    const { data } = await supabase
      .from('channel_views')
      .select('channel_id, last_seen_at')
      .eq('user_id', currentUser.id);
    channelViews = {};
    for (const row of (data || [])) {
      channelViews[row.channel_id] = row.last_seen_at;
    }
  }

  async function getChannelUnread(channelId) {
    const lastSeen = channelViews[channelId];
    const query = supabase
      .from('posts')
      .select('id', { count: 'exact', head: true })
      .eq('channel_id', channelId);
    if (lastSeen) {
      query.gt('created_at', lastSeen);
    }
    const { count } = await query;
    return (count || 0) > 0;
  }

  async function checkMainFeedUnread() {
    // Main feed uses channel_id IS NULL — use a known sentinel key
    const lastSeen = channelViews['__main__'];
    const query = supabase
      .from('posts')
      .select('id', { count: 'exact', head: true })
      .is('channel_id', null);
    if (lastSeen) {
      query.gt('created_at', lastSeen);
    }
    const { count } = await query;
    return (count || 0) > 0;
  }

  function renderSidebar() {
    const groups = document.getElementById('channel-groups');
    if (!channels.length) { groups.innerHTML = ''; return; }

    // Group by category
    const byCategory = {};
    for (const ch of channels) {
      const cat = ch.category || 'Other';
      if (!byCategory[cat]) byCategory[cat] = [];
      byCategory[cat].push(ch);
    }

    groups.innerHTML = Object.entries(byCategory).map(([cat, chs]) => `
      <div class="sidebar-section">
        <div class="sidebar-category">${escapeHtml(cat)}</div>
        ${chs.map(ch => `
          <div class="channel-item" data-channel-id="${escapeHtml(ch.id)}" id="channel-${escapeHtml(ch.id)}">
            <span class="channel-item-name">
              <span class="channel-hash">#</span>
              ${escapeHtml(ch.name)}
            </span>
            <span class="unread-dot" id="dot-${escapeHtml(ch.id)}" style="display:none;"></span>
          </div>
        `).join('')}
      </div>
    `).join('');

    // Attach click handlers
    document.querySelectorAll('.channel-item[data-channel-id]').forEach(el => {
      el.addEventListener('click', () => selectChannel(el.dataset.channelId, el));
    });

    // Load unread state async (non-blocking)
    loadUnreadIndicators();
  }

  async function loadUnreadIndicators() {
    // Main feed
    const mainUnread = await checkMainFeedUnread();
    // No dot for main feed — it's always the landing default

    // Channels
    await Promise.all(channels.map(async ch => {
      const hasUnread = await getChannelUnread(ch.id);
      const dot = document.getElementById(`dot-${ch.id}`);
      if (dot) dot.style.display = hasUnread ? 'block' : 'none';
    }));
  }

  async function selectChannel(channelId, clickedEl) {
    if (channelId === activeChannelId) return;

    // Update active state
    document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
    clickedEl.classList.add('active');

    activeChannelId = channelId || null;

    // Update header
    if (!channelId) {
      activeChannelName = 'Main Feed';
      document.getElementById('feed-header-hash').textContent = '#';
      document.getElementById('feed-header-name').textContent = 'Main Feed';
    } else {
      const ch = channels.find(c => c.id === channelId);
      activeChannelName = ch?.name || channelId;
      document.getElementById('feed-header-hash').textContent = '#';
      document.getElementById('feed-header-name').textContent = activeChannelName;

      // Mark viewed — upsert channel_views
      supabase.from('channel_views').upsert(
        { user_id: currentUser.id, channel_id: channelId, last_seen_at: new Date().toISOString() },
        { onConflict: 'user_id,channel_id' }
      ).then(() => {
        channelViews[channelId] = new Date().toISOString();
        const dot = document.getElementById(`dot-${channelId}`);
        if (dot) dot.style.display = 'none';
      });
    }

    openCommentThreads.clear();
    subscribeRealtime();
    await loadFeed();
  }

  // ── Feed ───────────────────────────────────────────────────────────────
  async function loadFeed() {
    const feedList = document.getElementById('feed-list');
    feedList.innerHTML = '<div class="feed-loading"><div class="spinner" style="margin:0 auto;"></div></div>';

    let query = supabase
      .from('posts')
      .select('id, author_id, channel_id, content, is_pinned, created_at, post_type, video_url')
      .order('is_pinned', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(30);

    if (activeChannelId === null) {
      query = query.is('channel_id', null);
    } else {
      query = query.eq('channel_id', activeChannelId);
    }

    const { data: posts, error } = await query;

    if (error) {
      feedList.innerHTML = '<div class="feed-error">Couldn\'t load posts. Try refreshing.</div>';
      return;
    }

    if (!posts || posts.length === 0) {
      feedList.innerHTML = `
        <div class="feed-empty">
          <strong>No posts yet</strong>
          Be the first to post in ${activeChannelId ? '#' + activeChannelName : 'the main feed'}.
        </div>`;
      return;
    }

    const postIds = posts.map(p => p.id);
    const authorIds = [...new Set(posts.map(p => p.author_id))];

    // Load author profiles, reactions, comment counts, and recent comments in parallel
    const [{ data: authorProfiles }, { data: reactions }, { data: mineRaw }, { data: commentCountRows }, { data: recentCommentRows }] = await Promise.all([
      supabase.from('profiles').select('user_id, display_name, photo_url').in('user_id', authorIds),
      supabase.from('post_reactions').select('post_id, reaction_type, user_id').in('post_id', postIds),
      supabase.from('post_reactions').select('post_id, reaction_type').in('post_id', postIds).eq('user_id', currentUser.id),
      supabase.from('comments').select('post_id').in('post_id', postIds),
      supabase.from('comments').select('id, post_id, content, created_at, author_id').in('post_id', postIds).order('created_at', { ascending: false }),
    ]);

    // Build profile map (will grow to include clappers and comment authors)
    const profileMap = {};
    for (const p of (authorProfiles || [])) profileMap[p.user_id] = p;
    for (const post of posts) post.profiles = profileMap[post.author_id] || {};

    // Build reaction counts, my reactions, and clapper user_ids per post
    postReactionCounts = {};
    myReactions = new Set();
    postClappers = {};

    const clapperUserIds = new Set();
    for (const r of (reactions || [])) {
      postReactionCounts[r.post_id] = (postReactionCounts[r.post_id] || 0) + 1;
      if (r.reaction_type === 'clap') {
        if (!postClappers[r.post_id]) postClappers[r.post_id] = [];
        postClappers[r.post_id].push(r.user_id);
        clapperUserIds.add(r.user_id);
      }
    }
    for (const r of (mineRaw || [])) {
      myReactions.add(`${r.post_id}:${r.reaction_type}`);
    }

    // Fetch clapper profiles not already in profileMap
    const newClapperIds = [...clapperUserIds].filter(id => !profileMap[id]);
    if (newClapperIds.length > 0) {
      const { data: clapperProfiles } = await supabase
        .from('profiles').select('user_id, display_name').in('user_id', newClapperIds);
      for (const p of (clapperProfiles || [])) profileMap[p.user_id] = p;
    }

    // Resolve clapper user_ids → display_names
    for (const [postId, userIds] of Object.entries(postClappers)) {
      postClappers[postId] = userIds.map(uid => profileMap[uid]?.display_name || 'Member');
    }

    // Build total comment counts (lightweight — only post_id fetched)
    postCommentCounts = {};
    for (const c of (commentCountRows || [])) {
      postCommentCounts[c.post_id] = (postCommentCounts[c.post_id] || 0) + 1;
    }

    // Build preview map: top 3 per post (recentCommentRows already sorted DESC), reverse to ASC
    previewCommentsMap = {};
    for (const c of (recentCommentRows || [])) {
      if (!previewCommentsMap[c.post_id]) previewCommentsMap[c.post_id] = [];
      if (previewCommentsMap[c.post_id].length < 3) previewCommentsMap[c.post_id].push(c);
    }
    for (const pid of Object.keys(previewCommentsMap)) previewCommentsMap[pid].reverse();

    // Fetch profiles for comment authors not already in profileMap
    const commentAuthorIds = [...new Set((recentCommentRows || []).map(c => c.author_id))].filter(id => !profileMap[id]);
    if (commentAuthorIds.length > 0) {
      const { data: commentAuthorProfiles } = await supabase
        .from('profiles').select('user_id, display_name, photo_url').in('user_id', commentAuthorIds);
      for (const p of (commentAuthorProfiles || [])) profileMap[p.user_id] = p;
    }

    // Attach profiles to preview comments
    for (const comments of Object.values(previewCommentsMap)) {
      for (const c of comments) c.profiles = profileMap[c.author_id] || {};
    }

    // Store profileMap for mention rendering
    globalProfileMap = profileMap;

    feedList.innerHTML = posts.map(post =>
      renderPostCard(post, postCommentCounts[post.id] || 0, previewCommentsMap[post.id] || [])
    ).join('');

    startRelativeTimers(60000, userTimezone);
    attachPostListeners(posts);
  }

  // ── Video embed helpers ────────────────────────────────────────────────
  function extractVideoEmbed(url) {
    if (!url) return null;
    const s = String(url).trim();
    const ytMatch = s.match(/(?:youtube\.com\/watch\?(?:.*&)?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
    if (ytMatch) return { embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}` };
    const driveFileMatch = s.match(/drive\.google\.com\/file\/d\/([^/?&#]+)/);
    if (driveFileMatch) return { embedUrl: `https://drive.google.com/file/d/${driveFileMatch[1]}/preview` };
    const driveOpenMatch = s.match(/drive\.google\.com\/open\?(?:.*&)?id=([^&#]+)/);
    if (driveOpenMatch) return { embedUrl: `https://drive.google.com/file/d/${driveOpenMatch[1]}/preview` };
    return null;
  }

  function videoEmbedHtml(url) {
    const embed = extractVideoEmbed(url);
    if (!embed) return '';
    return `<div style="margin-top:12px;">
      <iframe src="${escapeHtml(embed.embedUrl)}" width="100%"
        style="aspect-ratio:16/9;border-radius:6px;border:none;background:#000;"
        allowfullscreen loading="lazy"></iframe>
    </div>`;
  }

  // ── Render helpers ─────────────────────────────────────────────────────
  function renderCommentThread(postId, totalCount, previewComments) {
    const commentListHtml = previewComments.length > 0
      ? previewComments.map(c => renderComment(c)).join('')
      : '<div class="no-comments">No comments yet. Be the first!</div>';
    const viewAllLink = totalCount > 3
      ? `<a href="/app/post.html?id=${escapeHtml(postId)}" class="view-all-link">View all ${totalCount} comments →</a>`
      : '';
    return `
      <div id="comments-${escapeHtml(postId)}">${commentListHtml}</div>
      ${viewAllLink}
      <div class="comment-composer">
        <textarea class="comment-input" id="comment-input-${escapeHtml(postId)}" placeholder="Write a comment… (use @ to mention)" rows="1"></textarea>
        <button class="btn-comment" id="btn-comment-${escapeHtml(postId)}">Post</button>
      </div>
      <span class="mention-limit-error" id="comment-error-${escapeHtml(postId)}" style="font-size:11px;color:var(--red);display:none;margin-top:3px;"></span>
    `;
  }

  function renderPostCard(post, totalCount, previewComments = []) {
    const profile = post.profiles || {};
    const authorName = profile.display_name || 'Member';
    const photoUrl = profile.photo_url || null;
    const reacted = myReactions.has(`${post.id}:clap`);
    const clapCount = postReactionCounts[post.id] || 0;
    const commentLabel = totalCount === 1 ? '1 comment' : `${totalCount} comments`;
    const isVideo = post.post_type === 'video' && post.video_url;
    const hasText = post.content && stripHtml(post.content).trim();

    return `
      <div class="post-card" id="post-${post.id}" data-post-id="${post.id}" data-author-id="${escapeHtml(post.author_id)}">
        ${post.is_pinned ? '<div class="post-pin-badge">📌 Pinned</div>' : ''}
        <div class="post-meta">
          ${avatarEl(photoUrl, authorName)}
          <div class="post-author-info">
            <div class="post-author" style="display:flex;align-items:center;gap:6px;">
              <a class="author-link" href="/app/member.html?id=${escapeHtml(post.author_id)}">${escapeHtml(authorName)}</a>
              ${isVideo ? '<span class="video-badge">▶ Video</span>' : ''}
            </div>
            <span class="post-time" data-timestamp="${escapeHtml(post.created_at)}">${relativeTime(post.created_at)}</span>
          </div>
        </div>
        ${hasText ? `<div class="post-body">${sanitizeHTML(post.content)}</div>` : ''}
        ${isVideo ? videoEmbedHtml(post.video_url) : ''}
        <div class="post-actions">
          <div class="reaction-wrapper" data-post-id="${post.id}">
            <button class="reaction-btn${reacted ? ' reacted' : ''}" data-post-id="${post.id}" data-reaction="clap" aria-label="Clap">
              👏 <span class="reaction-count">${clapCount > 0 ? clapCount : ''}</span>
            </button>
            <div class="clapper-tooltip" id="tooltip-${post.id}"></div>
          </div>
          <button class="comment-toggle-btn" data-post-id="${post.id}">
            ${commentLabel}
          </button>
        </div>
        <div class="comment-thread" id="thread-${post.id}">
          ${renderCommentThread(post.id, totalCount, previewComments)}
        </div>
      </div>
    `;
  }

  function attachPostListeners(posts) {
    const feedList = document.getElementById('feed-list');

    feedList.querySelectorAll('.reaction-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleReaction(btn.dataset.postId, btn.dataset.reaction, btn));
    });

    feedList.querySelectorAll('.comment-toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleCommentThread(btn.dataset.postId));
    });

    posts.forEach(post => {
      wireCommentComposer(post.id);
    });

    attachTooltipListeners(feedList);
  }

  function wireCommentComposer(postId) {
    const textarea = document.getElementById(`comment-input-${postId}`);
    const btn = document.getElementById(`btn-comment-${postId}`);
    commentMentionsMap[postId] = [];
    if (textarea) {
      textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        handleCommentMentionInput(textarea, postId);
      });
      textarea.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitComment(postId); }
      });
    }
    if (btn) btn.addEventListener('click', () => submitComment(postId));
  }

  // ── Reaction tooltips ──────────────────────────────────────────────────
  function attachTooltipListeners(container) {
    container.querySelectorAll('.reaction-wrapper').forEach(wrapper => {
      const tooltip = wrapper.querySelector('.clapper-tooltip');
      if (!tooltip) return;
      const postId = wrapper.dataset.postId;
      let longPressTimer = null;

      wrapper.addEventListener('mouseenter', () => showTooltip(tooltip, postId));
      wrapper.addEventListener('mouseleave', () => hideTooltip(tooltip));

      wrapper.addEventListener('touchstart', () => {
        longPressTimer = setTimeout(() => showTooltip(tooltip, postId), 500);
      }, { passive: true });
      wrapper.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
      wrapper.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });
    });
  }

  function showTooltip(tooltip, postId) {
    const names = postClappers[postId] || [];
    tooltip.innerHTML = names.length > 0
      ? names.map(n => `<span class="clapper-name">${escapeHtml(n)}</span>`).join('')
      : '<span class="clapper-empty">No reactions yet</span>';
    tooltip.classList.add('visible');
  }

  function hideTooltip(tooltip) {
    tooltip.classList.remove('visible');
  }

  document.addEventListener('touchstart', e => {
    document.querySelectorAll('.clapper-tooltip.visible').forEach(t => {
      const wrapper = t.closest('.reaction-wrapper');
      if (wrapper && !wrapper.contains(e.target)) hideTooltip(t);
    });
  }, { passive: true });

  // ── Reactions ──────────────────────────────────────────────────────────
  async function toggleReaction(postId, reactionType, btn) {
    const key = `${postId}:${reactionType}`;
    const hasReacted = myReactions.has(key);
    const countEl = btn.querySelector('.reaction-count');

    // Optimistic update
    if (hasReacted) {
      myReactions.delete(key);
      postReactionCounts[postId] = Math.max(0, (postReactionCounts[postId] || 1) - 1);
      btn.classList.remove('reacted');
      if (reactionType === 'clap') {
        postClappers[postId] = (postClappers[postId] || []).filter(n => n !== currentUserDisplayName);
      }
    } else {
      myReactions.add(key);
      postReactionCounts[postId] = (postReactionCounts[postId] || 0) + 1;
      btn.classList.add('reacted');
      if (reactionType === 'clap') {
        if (!postClappers[postId]) postClappers[postId] = [];
        if (!postClappers[postId].includes(currentUserDisplayName)) {
          postClappers[postId].push(currentUserDisplayName);
        }
      }
    }
    const newCount = postReactionCounts[postId] || 0;
    countEl.textContent = newCount > 0 ? newCount : '';

    if (hasReacted) {
      await supabase.from('post_reactions')
        .delete()
        .eq('post_id', postId)
        .eq('user_id', currentUser.id)
        .eq('reaction_type', reactionType);
    } else {
      await supabase.from('post_reactions')
        .insert({ post_id: postId, user_id: currentUser.id, reaction_type: reactionType });
    }
  }

  // ── Comments ───────────────────────────────────────────────────────────
  function toggleCommentThread(postId) {
    const thread = document.getElementById(`thread-${postId}`);
    if (!thread) return;
    if (openCommentThreads.has(postId)) {
      openCommentThreads.delete(postId);
      thread.classList.remove('open');
    } else {
      openCommentThreads.add(postId);
      thread.classList.add('open');
    }
  }

  function renderComment(c) {
    const profile = c.profiles || {};
    const name = profile.display_name || 'Member';
    const displayNameMap = buildDisplayNameMap(globalProfileMap);
    const commentHtml = sanitizeHTML(convertMentions(c.content, displayNameMap));
    return `
      <div class="comment-item" id="comment-${c.id}">
        ${commentAvatarEl(profile.photo_url, name)}
        <div class="comment-body">
          <div class="comment-header">
            <a class="comment-author author-link" href="/app/member.html?id=${escapeHtml(c.author_id)}">${escapeHtml(name)}</a>
            <span class="comment-time" data-timestamp="${escapeHtml(c.created_at)}">${relativeTime(c.created_at)}</span>
          </div>
          <div class="comment-text">${commentHtml}</div>
        </div>
      </div>
    `;
  }

  async function submitComment(postId) {
    const textarea = document.getElementById(`comment-input-${postId}`);
    const btn = document.getElementById(`btn-comment-${postId}`);
    const content = (textarea?.value || '').trim();
    if (!content) return;

    btn.disabled = true;

    const { data: newComment, error } = await supabase
      .from('comments')
      .insert({ post_id: postId, author_id: currentUser.id, content })
      .select('id, content, created_at, author_id')
      .single();

    btn.disabled = false;

    if (error || !newComment) return;

    // Fire mention notifications
    const mentions = commentMentionsMap[postId] || [];
    if (mentions.length > 0) {
      Promise.all(mentions
        .filter(m => m.userId !== currentUser.id)
        .map(m => supabase.from('notifications').insert({
          user_id: m.userId,
          type: 'mention',
          title: 'You were mentioned',
          body: `${currentUserDisplayName} mentioned you in a comment`,
          link: `/app/post.html?id=${postId}#comment-${newComment.id}`,
          read: false,
        }))
      );
      commentMentionsMap[postId] = [];
    }

    const { data: newCommentProfile } = await supabase
      .from('profiles')
      .select('user_id, display_name, photo_url')
      .eq('user_id', currentUser.id)
      .single();
    newComment.profiles = newCommentProfile || {};

    textarea.value = '';
    textarea.style.height = '';

    const listEl = document.getElementById(`comments-${postId}`);
    const noComments = listEl?.querySelector('.no-comments');
    if (noComments) noComments.remove();

    if (listEl) listEl.insertAdjacentHTML('beforeend', renderComment(newComment));

    postCommentCounts[postId] = (postCommentCounts[postId] || 0) + 1;
    updateCommentCount(postId);
  }

  function updateCommentCount(postId) {
    const btn = document.querySelector(`.comment-toggle-btn[data-post-id="${postId}"]`);
    if (!btn) return;
    const count = postCommentCounts[postId] || 0;
    btn.textContent = count === 1 ? '1 comment' : `${count} comments`;
  }

  // ── Post submit ────────────────────────────────────────────────────────
  async function submitPost() {
    const errorEl = document.getElementById('composer-error');
    const btn = document.getElementById('btn-post');
    errorEl.textContent = '';

    const html = quill.root.innerHTML;
    const text = stripHtml(html).trim();
    if (!text && !videoUrl) {
      errorEl.textContent = 'Post cannot be empty.';
      return;
    }

    // Collect mentioned users from Quill delta
    const delta = quill.getContents();
    const mentionedUsers = [];
    delta.ops.forEach(op => {
      if (op.insert?.mention) {
        const { userId } = op.insert.mention;
        if (!mentionedUsers.includes(userId)) mentionedUsers.push(userId);
      }
    });

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Posting…';

    const payload = {
      author_id: currentUser.id,
      content: html,
      channel_id: activeChannelId || null,
      post_type: videoUrl ? 'video' : 'text',
      video_url: videoUrl || null,
    };

    const { data: newPost, error } = await supabase.from('posts').insert(payload).select('id').single();

    btn.disabled = false;
    btn.innerHTML = 'Post';

    if (error) {
      errorEl.textContent = 'Failed to post. Please try again.';
      return;
    }

    // Fire mention notifications
    if (newPost && mentionedUsers.length > 0) {
      Promise.all(mentionedUsers
        .filter(uid => uid !== currentUser.id)
        .map(uid => supabase.from('notifications').insert({
          user_id: uid,
          type: 'mention',
          title: 'You were mentioned',
          body: `${currentUserDisplayName} mentioned you in a post`,
          link: `/app/post.html?id=${newPost.id}`,
          read: false,
        }))
      );
    }

    quill.setText('');
    mentionCount = 0;
    resetVideoComposer();
  }

  function resetVideoComposer() {
    videoUrl = null;
    const input = document.getElementById('video-url-input');
    if (input) input.value = '';
    const panel = document.getElementById('video-input-panel');
    if (panel) panel.style.display = 'none';
    const btnAddVideo = document.getElementById('btn-add-video');
    if (btnAddVideo) { btnAddVideo.textContent = '▶ Add Video'; btnAddVideo.classList.remove('has-video'); }
    const previewArea = document.getElementById('video-preview-area');
    if (previewArea) previewArea.innerHTML = '';
    const validationMsg = document.getElementById('video-validation-msg');
    if (validationMsg) validationMsg.textContent = '';
  }

  // ── Video composer ─────────────────────────────────────────────────────
  function updateVideoPreview(url) {
    const validationMsg = document.getElementById('video-validation-msg');
    const previewArea = document.getElementById('video-preview-area');
    const btnAddVideo = document.getElementById('btn-add-video');
    if (!url) {
      videoUrl = null;
      validationMsg.textContent = '';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
      return;
    }
    const embed = extractVideoEmbed(url);
    if (embed) {
      videoUrl = url;
      validationMsg.textContent = '';
      previewArea.innerHTML = `<iframe src="${escapeHtml(embed.embedUrl)}" width="100%"
        style="aspect-ratio:16/9;border-radius:6px;border:none;background:#000;"
        allowfullscreen loading="lazy"></iframe>`;
      btnAddVideo.textContent = '▶ Video Added ✓';
      btnAddVideo.classList.add('has-video');
    } else {
      videoUrl = null;
      validationMsg.textContent = 'Please paste a YouTube or Google Drive link';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
    }
  }

  function initVideoComposer() {
    const btnAddVideo = document.getElementById('btn-add-video');
    const panel = document.getElementById('video-input-panel');
    const input = document.getElementById('video-url-input');
    const btnRemove = document.getElementById('btn-remove-video');

    btnAddVideo.addEventListener('click', () => {
      if (videoUrl) {
        resetVideoComposer();
      } else {
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if (panel.style.display === 'block') input.focus();
      }
    });

    btnRemove.addEventListener('click', () => {
      videoUrl = null;
      input.value = '';
      const validationMsg = document.getElementById('video-validation-msg');
      const previewArea = document.getElementById('video-preview-area');
      validationMsg.textContent = '';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
    });

    input.addEventListener('input', () => {
      clearTimeout(videoDebounceTimer);
      videoDebounceTimer = setTimeout(() => updateVideoPreview(input.value.trim()), 400);
    });
  }

  // ── Realtime ───────────────────────────────────────────────────────────
  let newPostsChannel = null;

  function subscribeRealtime() {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabase
      .channel(`posts-delete:${activeChannelId ?? 'main'}`)
      .on('postgres_changes', {
        event: 'DELETE',
        schema: 'public',
        table: 'posts',
      }, payload => handleRealtimeDelete(payload.old?.id))
      .subscribe();
  }

  function subscribeNewPosts() {
    if (newPostsChannel) supabase.removeChannel(newPostsChannel);
    newPostsChannel = supabase
      .channel('feed-new-posts')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'posts',
      }, payload => handleNewPost(payload))
      .subscribe();
    window.addEventListener('beforeunload', () => {
      if (newPostsChannel) supabase.removeChannel(newPostsChannel);
    }, { once: true });
  }

  async function handleNewPost(payload) {
    const postId = payload.new?.id;
    if (!postId) return;

    // Duplicate check
    if (document.getElementById(`post-${postId}`)) return;

    // Refetch full post record (payload may not include all columns)
    const { data: post } = await supabase
      .from('posts')
      .select('id, author_id, channel_id, content, is_pinned, created_at, post_type, video_url')
      .eq('id', postId)
      .single();
    if (!post) return;

    // JS-level channel filter
    if (activeChannelId === null && post.channel_id !== null) return;
    if (activeChannelId !== null && post.channel_id !== activeChannelId) return;

    // Fetch author profile (two-query pattern)
    const { data: authorProfiles } = await supabase
      .from('profiles').select('display_name, photo_url').eq('user_id', post.author_id);
    post.profiles = (authorProfiles || [])[0] || {};

    postCommentCounts[post.id] = 0;
    previewCommentsMap[post.id] = [];

    const feedList = document.getElementById('feed-list');
    const emptyEl = feedList.querySelector('.feed-empty, .feed-loading');
    if (emptyEl) emptyEl.remove();

    const firstNonPinned = feedList.querySelector('.post-card:not([data-pinned])');
    const html = renderPostCard(post, 0, []);
    if (firstNonPinned && !post.is_pinned) {
      firstNonPinned.insertAdjacentHTML('beforebegin', html);
    } else {
      feedList.insertAdjacentHTML('afterbegin', html);
    }

    const newCard = document.getElementById(`post-${post.id}`);
    if (newCard) {
      newCard.querySelectorAll('.reaction-btn').forEach(btn =>
        btn.addEventListener('click', () => toggleReaction(btn.dataset.postId, btn.dataset.reaction, btn))
      );
      newCard.querySelectorAll('.comment-toggle-btn').forEach(btn =>
        btn.addEventListener('click', () => toggleCommentThread(btn.dataset.postId))
      );
      wireCommentComposer(post.id);
      attachTooltipListeners(newCard);
    }
  }

  function handleRealtimeDelete(postId) {
    if (!postId) return;
    const el = document.getElementById(`post-${postId}`);
    if (el) el.remove();

    const feedList = document.getElementById('feed-list');
    if (!feedList.querySelector('.post-card')) {
      feedList.innerHTML = `
        <div class="feed-empty">
          <strong>No posts yet</strong>
          Be the first to post in ${activeChannelId ? '#' + activeChannelName : 'the main feed'}.
        </div>`;
    }
  }

  init();
</script>
