  async function submitComment(postId) {
    const textarea = document.getElementById(`comment-input-${postId}`);
    const btn = document.getElementById(`btn-comment-${postId}`);
    const content = (textarea?.value || '').trim();
    if (!content) return;

    btn.disabled = true;
    const { data: newComment, error } = await supabase
      .from('comments')
      .insert({ post_id: postId, author_id: currentUser.id, content })
      .select('id, post_id, content, created_at, author_id')
      .single();
    btn.disabled = false;

    if (error || !newComment) return;

    // Append comment immediately using cached profile — do not block UI
    newComment.profiles = globalProfileMap[currentUser.id]
      || { display_name: currentUserDisplayName, photo_url: null };
    textarea.value = '';
    textarea.style.height = '';
    const listEl = document.getElementById(`comments-${postId}`);
    const noComments = listEl?.querySelector('.no-comments');
    if (noComments) noComments.remove();
    const postAuthorId = document.getElementById('post-' + postId)?.dataset.authorId || '';
    if (listEl) listEl.insertAdjacentHTML('beforeend', renderComment(newComment, postAuthorId));
    postCommentCounts[postId] = (postCommentCounts[postId] || 0) + 1;
    updateCommentCount(postId);
    wireCommentLikes(listEl);

    // Mention notifications (non-blocking)
    const mentions = commentMentionsMap[postId] || [];
    const mentionedIds = mentions.filter(m => m.userId !== currentUser.id).map(m => m.userId);
    if (mentionedIds.length > 0) {
      Promise.all(mentionedIds.map(uid => supabase.from('notifications').insert({
        user_id: uid, type: 'mention',
        title: 'You were mentioned',
        body: `${currentUserDisplayName} mentioned you in a comment`,
        link: `/app/post.html?id=${postId}#comment-${newComment.id}`,
        read: false, context_id: postId,
      })));
      commentMentionsMap[postId] = [];
    }

    // Follow notifications + auto-follow run in background — do not block UI
    (async () => {
      try {
        const followers = await getPostFollowers(postId);
        if (followers && followers.length > 0) {
          const excludeIds = new Set([currentUser.id, ...mentionedIds]);
          const targets = followers.filter(uid => !excludeIds.has(uid));
          if (targets.length > 0) {
            await Promise.all(targets.map(async followerId => {
              try {
                console.log('post_reply context_id:', postId, typeof postId);
                console.log('batch lookup filters:', { followerId, type: 'post_reply', read: false, context_id: postId });
                const { data: existing, error: lookupError } = await supabase.from('notifications')
                  .select('id, notification_count')
                  .eq('user_id', followerId).eq('type', 'post_reply').eq('read', false)
                  .eq('context_id', postId)
                  .limit(1).maybeSingle();
                console.log('batch lookup result:', JSON.stringify(existing), 'error:', JSON.stringify(lookupError));
                if (existing) {
                  console.log('taking UPDATE path, id:', existing.id);
                  const newCount = (existing.notification_count || 1) + 1;
                  const { data: updateData, error: updateError } = await supabase.from('notifications').update({
                    notification_count: newCount,
                    body: `${newCount} new replies to a post you're following`,
                    link: `/app/post.html?id=${postId}`,
                  }).eq('id', existing.id);
                  console.log('UPDATE result:', JSON.stringify(updateData), 'error:', JSON.stringify(updateError));
                } else {
                  console.log('taking INSERT path — no existing found');
                  console.log('post_reply context_id:', postId, typeof postId);
                  await supabase.from('notifications').insert({
                    user_id: followerId, type: 'post_reply',
                    title: "New reply on a post you're following",
                    body: `${currentUserDisplayName} replied to a post you're following`,
                    link: `/app/post.html?id=${postId}#comment-${newComment.id}`,
                    read: false, notification_count: 1, context_id: postId,
                  });
                }
              } catch (err) {
                console.error('Follow notification error for', followerId, err);
              }
            }));
          }
        }
      } catch (err) {
        console.error('Follow notification IIFE error:', err);
      }
      const alreadyFollowing = await isFollowingPost(postId);
      if (!alreadyFollowing) {
        await followPost(postId);
        const followBtn = document.querySelector(`.follow-post-btn[data-post-id="${postId}"]`);
        if (followBtn) updateFollowButtonState(followBtn, true);
      }
    })();
  }

  function updateCommentCount(postId) {
    const btn = document.querySelector(`.comment-toggle-btn[data-post-id="${postId}"]`);
    if (!btn) return;
    const count = postCommentCounts[postId] || 0;
    btn.textContent = count === 1 ? '1 comment' : `${count} comments`;
  }

  // ── Post submit ────────────────────────────────────────────────────────
  async function submitPost() {
    const errorEl = document.getElementById('composer-error');
    const btn = document.getElementById('btn-post');
    errorEl.textContent = '';

    const html = quill.root.innerHTML;
    const text = stripHtml(html).trim();
    const title = (document.getElementById('post-title-input')?.value || '').trim() || null;
    if (!text && !videoUrl && !pendingAudioUrl) {
      errorEl.textContent = 'Post cannot be empty.';
      return;
    }

    // Collect mentioned users from Quill delta
    const delta = quill.getContents();
    const mentionedUsers = [];
    delta.ops.forEach(op => {
      if (op.insert?.mention) {
        const { userId } = op.insert.mention;
        if (!mentionedUsers.includes(userId)) mentionedUsers.push(userId);
      }
    });

    btn.disabled = true;
    btn.innerHTML = '<span class="btn-spinner"></span> Posting…';

    const payload = {
      author_id: currentUser.id,
      content: html,
      channel_id: activeChannelId || null,
      post_type: videoUrl ? 'video' : (pendingAudioUrl ? 'audio' : 'text'),
      video_url: videoUrl || null,
      audio_url: pendingAudioUrl || null,
      title: title,
    };

    const { data: newPost, error } = await supabase.from('posts').insert(payload).select('id').single();

    btn.disabled = false;
    btn.innerHTML = 'Post';

    if (error) {
      errorEl.textContent = 'Failed to post. Please try again.';
      return;
    }

    // Fire mention notifications
    if (newPost && mentionedUsers.length > 0) {
      Promise.all(mentionedUsers
        .filter(uid => uid !== currentUser.id)
        .map(uid => supabase.from('notifications').insert({
          user_id: uid,
          type: 'mention',
          title: 'You were mentioned',
          body: `${currentUserDisplayName} mentioned you in a post`,
          link: `/app/post.html?id=${newPost.id}`,
          read: false, context_id: newPost.id,
        }))
      );
    }

    quill.setText('');
    mentionCount = 0;
    const titleInput = document.getElementById('post-title-input');
    if (titleInput) titleInput.value = '';
    resetVideoComposer();
    resetAudioComposer();
  }

  function resetVideoComposer() {
    videoUrl = null;
    const input = document.getElementById('video-url-input');
    if (input) input.value = '';
    const panel = document.getElementById('video-input-panel');
    if (panel) panel.style.display = 'none';
    const btnAddVideo = document.getElementById('btn-add-video');
    if (btnAddVideo) { btnAddVideo.textContent = '▶ Add Video'; btnAddVideo.classList.remove('has-video'); }
    const previewArea = document.getElementById('video-preview-area');
    if (previewArea) previewArea.innerHTML = '';
    const validationMsg = document.getElementById('video-validation-msg');
    if (validationMsg) validationMsg.textContent = '';
    setMediaBtnsMutualExclusive(null);
  }

  // ── Video composer ─────────────────────────────────────────────────────
  function updateVideoPreview(url) {
    const validationMsg = document.getElementById('video-validation-msg');
    const previewArea = document.getElementById('video-preview-area');
    const btnAddVideo = document.getElementById('btn-add-video');
    if (!url) {
      videoUrl = null;
      validationMsg.textContent = '';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
      return;
    }
    const embed = extractVideoEmbed(url);
    if (embed) {
      videoUrl = url;
      validationMsg.textContent = '';
      previewArea.innerHTML = `<iframe src="${escapeHtml(embed.embedUrl)}" width="100%"
        style="aspect-ratio:16/9;border-radius:6px;border:none;background:#000;"
        allowfullscreen loading="lazy"></iframe>`;
      btnAddVideo.textContent = '▶ Video Added ✓';
      btnAddVideo.classList.add('has-video');
      setMediaBtnsMutualExclusive('video');
    } else {
      videoUrl = null;
      validationMsg.textContent = 'Please paste a YouTube or Google Drive link';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
      setMediaBtnsMutualExclusive(null);
    }
  }

  function initVideoComposer() {
    const btnAddVideo = document.getElementById('btn-add-video');
    const panel = document.getElementById('video-input-panel');
    const input = document.getElementById('video-url-input');
    const btnRemove = document.getElementById('btn-remove-video');

    btnAddVideo.addEventListener('click', () => {
      if (videoUrl) {
        resetVideoComposer();
      } else {
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        if (panel.style.display === 'block') input.focus();
      }
    });

    btnRemove.addEventListener('click', () => {
      videoUrl = null;
      input.value = '';
      const validationMsg = document.getElementById('video-validation-msg');
      const previewArea = document.getElementById('video-preview-area');
      validationMsg.textContent = '';
      previewArea.innerHTML = '';
      btnAddVideo.textContent = '▶ Add Video';
      btnAddVideo.classList.remove('has-video');
      setMediaBtnsMutualExclusive(null);
    });

    input.addEventListener('input', () => {
      clearTimeout(videoDebounceTimer);
      videoDebounceTimer = setTimeout(() => updateVideoPreview(input.value.trim()), 400);
    });
  }

  // ── Media mutual exclusivity ───────────────────────────────────────────
  function setMediaBtnsMutualExclusive(activeType) {
    const btnVideo = document.getElementById('btn-add-video');
    const btnUploadAudio = document.getElementById('btn-upload-audio');
    const micBtn = document.getElementById('voice-record-btn');
    if (!btnVideo || !btnUploadAudio) return;
    if (activeType === 'video') {
      btnUploadAudio.style.opacity = '0.4'; btnUploadAudio.style.cursor = 'not-allowed'; btnUploadAudio.style.pointerEvents = 'none';
      btnVideo.style.opacity = ''; btnVideo.style.cursor = ''; btnVideo.style.pointerEvents = '';
      if (micBtn) { micBtn.disabled = true; micBtn.style.opacity = '0.5'; micBtn.style.cursor = 'not-allowed'; }
    } else if (activeType === 'audio') {
      btnVideo.style.opacity = '0.4'; btnVideo.style.cursor = 'not-allowed'; btnVideo.style.pointerEvents = 'none';
      btnUploadAudio.style.opacity = ''; btnUploadAudio.style.cursor = ''; btnUploadAudio.style.pointerEvents = '';
      if (micBtn) { micBtn.disabled = true; micBtn.style.opacity = '0.5'; micBtn.style.cursor = 'not-allowed'; }
    } else {
      btnVideo.style.opacity = ''; btnVideo.style.cursor = ''; btnVideo.style.pointerEvents = '';
      btnUploadAudio.style.opacity = ''; btnUploadAudio.style.cursor = ''; btnUploadAudio.style.pointerEvents = '';
      if (micBtn && !audioMediaRecorder) { micBtn.disabled = false; micBtn.style.opacity = ''; micBtn.style.cursor = ''; }
    }
  }

  // ── Audio composer ─────────────────────────────────────────────────────
  function resetAudioComposer() {
    if (audioMediaRecorder && audioMediaRecorder.state !== 'inactive') {
      try { audioMediaRecorder.stop(); } catch (_) {}
    }
    audioMediaRecorder = null;
    clearInterval(audioRecordingTimer);
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    if (audioObjectUrl) { URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }
    audioChunks = [];
    pendingAudioUrl = null;
    const panel = document.getElementById('audio-input-panel');
    if (panel) panel.style.display = 'none';
    const btn = document.getElementById('btn-upload-audio');
    if (btn) { btn.textContent = '🎵 Upload Audio'; btn.classList.remove('has-audio'); }
    const statusEl = document.getElementById('audio-upload-status');
    if (statusEl) { statusEl.style.display = 'none'; statusEl.textContent = ''; }
    const preview = document.getElementById('audio-preview-player');
    if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
    setVoiceWidgetIdle();
    setMediaBtnsMutualExclusive(null);
  }

  // ── Voice record widget ────────────────────────────────────────────────

  function initVoiceRecordWidget() {
    const btn = document.getElementById('voice-record-btn');
    if (!btn) return;
    if (!window.MediaRecorder) {
      btn.disabled = true;
      btn.title = 'Recording not supported in this browser';
      btn.style.opacity = '0.4';
      return;
    }
    btn.addEventListener('click', handleVoiceRecordClick);
  }

  async function handleVoiceRecordClick() {
    if (audioMediaRecorder) {
      clearInterval(audioRecordingTimer);
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      audioMediaRecorder.stop();
      const btn = document.getElementById('voice-record-btn');
      if (btn) btn.classList.remove('recording');
    } else {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        audioMediaRecorder = new MediaRecorder(mediaStream);
        audioMediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        audioMediaRecorder.onstop = handleVoiceRecordingStop;
        audioMediaRecorder.start();
        setVoiceWidgetRecording();
        audioRecordingSeconds = 0;
        audioRecordingTimer = setInterval(() => {
          audioRecordingSeconds++;
          const m = Math.floor(audioRecordingSeconds / 60);
          const s = audioRecordingSeconds % 60;
          const t = document.getElementById('voice-timer');
          if (t) t.textContent = `${m}:${String(s).padStart(2, '0')}`;
        }, 1000);
      } catch (_) {
        const errEl = document.getElementById('composer-error');
        if (errEl) {
          errEl.textContent = 'Microphone access denied. Please allow microphone access in your browser settings.';
          setTimeout(() => { if (errEl.textContent.startsWith('Microphone')) errEl.textContent = ''; }, 5000);
        }
      }
    }
  }

  function handleVoiceRecordingStop() {
    audioMediaRecorder = null;
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    if (audioObjectUrl) URL.revokeObjectURL(audioObjectUrl);
    audioObjectUrl = URL.createObjectURL(blob);
    setVoiceWidgetPreview(audioObjectUrl);
  }

  function setVoiceWidgetIdle() {
    const btn = document.getElementById('voice-record-btn');
    const extras = document.getElementById('voice-record-extras');
    if (btn) {
      btn.textContent = '🎙';
      btn.classList.remove('recording');
      btn.title = 'Record a voice memo';
      btn.disabled = false;
      btn.style.opacity = '';
      btn.style.cursor = '';
      btn.onclick = null;
    }
    if (extras) extras.innerHTML = '';
  }

  function setVoiceWidgetRecording() {
    const btn = document.getElementById('voice-record-btn');
    const extras = document.getElementById('voice-record-extras');
    if (btn) {
      btn.textContent = '⏹';
      btn.classList.add('recording');
      btn.title = 'Tap to stop recording';
    }
    if (extras) extras.innerHTML = `<span id="voice-timer" class="voice-record-timer">0:00</span>`;
  }

  function setVoiceWidgetPreview(blobUrl) {
    const btn = document.getElementById('voice-record-btn');
    const extras = document.getElementById('voice-record-extras');
    if (btn) {
      btn.textContent = '▶';
      btn.classList.remove('recording');
      btn.title = 'Preview recording';
      btn.onclick = e => {
        e.stopPropagation();
        const audio = new Audio(blobUrl);
        audio.play().catch(() => {});
      };
    }
    if (extras) {
      extras.innerHTML = `
        <button type="button" class="voice-record-discard" id="voice-discard-btn">× discard</button>
        <button type="button" class="voice-record-use" id="voice-use-btn">✓ use</button>
      `;
      document.getElementById('voice-discard-btn').addEventListener('click', () => {
        if (audioObjectUrl) { URL.revokeObjectURL(audioObjectUrl); audioObjectUrl = null; }
        audioChunks = [];
        setVoiceWidgetIdle();
      });
      document.getElementById('voice-use-btn').addEventListener('click', async () => {
        const b = new Blob(audioChunks, { type: 'audio/webm' });
        await uploadAudioFile(b, `voice-memo-${Date.now()}.webm`);
      });
    }
  }

  async function uploadAudioFile(file, overrideName) {
    const name = overrideName || file.name || `audio-${Date.now()}.webm`;
    const safeName = name.replace(/[^a-zA-Z0-9._-]/g, '_');
    const path = `${currentUser.id}/${Date.now()}-${safeName}`;
    const contentType = file.type || 'audio/webm';
    const statusEl = document.getElementById('audio-upload-status');
    const preview = document.getElementById('audio-preview-player');
    if (statusEl) { statusEl.textContent = 'Uploading…'; statusEl.style.display = 'block'; }

    try {
      const { data, error } = await supabase.storage.from('post-audio').upload(path, file, { contentType, upsert: false });
      if (error) {
        console.error('Audio upload error:', error);
        showAudioError('Upload failed: ' + error.message);
        if (statusEl) { statusEl.style.display = 'none'; }
        return;
      }
      const { data: urlData } = supabase.storage.from('post-audio').getPublicUrl(data.path);
      pendingAudioUrl = urlData.publicUrl;
      console.log('Audio upload success, pendingAudioUrl:', pendingAudioUrl);
      if (statusEl) { statusEl.style.display = 'none'; }
      if (preview) {
        preview.innerHTML = `<div class="audio-post-player"><audio controls style="width:100%;accent-color:var(--gold);"><source src="${escapeHtml(pendingAudioUrl)}" type="${contentType}">Your browser does not support audio playback.</audio></div>`;
        preview.style.display = 'block';
      }
      const btnUploadAudio = document.getElementById('btn-upload-audio');
      if (btnUploadAudio) { btnUploadAudio.textContent = '🎵 Audio Added ✓'; btnUploadAudio.classList.add('has-audio'); }
      setMediaBtnsMutualExclusive('audio');
    } catch (err) {
      console.error('Audio upload exception:', err);
      showAudioError('Upload failed. Please try again.');
      if (statusEl) { statusEl.style.display = 'none'; }
    }
  }

  function showAudioError(msg) {
    const errEl = document.getElementById('composer-error');
    if (errEl) {
      errEl.textContent = msg;
      setTimeout(() => { if (errEl.textContent === msg) errEl.textContent = ''; }, 4000);
    }
  }

  function initAudioComposer() {
    const btnUploadAudio = document.getElementById('btn-upload-audio');
    const panel = document.getElementById('audio-input-panel');
    const fileInput = document.getElementById('audio-file-input');
    const dropzone = document.querySelector('.audio-dropzone');

    btnUploadAudio.addEventListener('click', () => {
      if (pendingAudioUrl) { resetAudioComposer(); return; }
      const isOpen = panel.style.display === 'block';
      panel.style.display = isOpen ? 'none' : 'block';
      // Disable mic when upload panel is open, re-enable when closed
      const micBtn = document.getElementById('voice-record-btn');
      if (micBtn && !pendingAudioUrl) {
        if (!isOpen) {
          micBtn.disabled = true; micBtn.style.opacity = '0.5'; micBtn.style.cursor = 'not-allowed';
        } else {
          micBtn.disabled = false; micBtn.style.opacity = ''; micBtn.style.cursor = '';
        }
      }
    });

    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if (file) await uploadAudioFile(file);
      fileInput.value = '';
    });

    if (dropzone) {
      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
      dropzone.addEventListener('drop', async e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) await uploadAudioFile(file);
      });
    }

    initVoiceRecordWidget();
  }

  // ── Realtime ───────────────────────────────────────────────────────────
  let newPostsChannel = null;

  function getActiveChannelId() { return activeChannelId; }

  function subscribeRealtime() {
    if (realtimeChannel) {
      supabase.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabase
      .channel(`posts-delete:${activeChannelId ?? 'main'}`)
      .on('postgres_changes', {
        event: 'DELETE',
        schema: 'public',
        table: 'posts',
      }, payload => handleRealtimeDelete(payload.old?.id))
      .subscribe();
  }

  function subscribeNewPosts() {
    if (newPostsChannel) supabase.removeChannel(newPostsChannel);
    newPostsChannel = supabase
      .channel('feed-new-posts')
      .on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'posts',
      }, payload => handleNewPost(payload))
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') {
          console.log('Feed realtime connected');
        }
        if (status === 'CHANNEL_ERROR') {
          console.error('Feed realtime error — channel failed');
        }
      });
    window.addEventListener('beforeunload', () => {
      if (newPostsChannel) supabase.removeChannel(newPostsChannel);
    }, { once: true });
  }

  async function handleNewPost(payload) {
    const postId = payload.new?.id;
    if (!postId) return;

    // Duplicate check
    if (document.getElementById(`post-${postId}`)) return;

    // Refetch full post record (payload may not include all columns)
    const { data: post } = await supabase
      .from('posts')
      .select('id, author_id, channel_id, content, title, is_pinned, created_at, post_type, video_url, audio_url')
      .eq('id', postId)
      .single();
    if (!post) return;

    // JS-level channel filter
    const currentChannelId = getActiveChannelId();
    if (currentChannelId === null && post.channel_id !== null) return;
    if (currentChannelId !== null && post.channel_id !== currentChannelId) return;

    // Fetch author profile (two-query pattern)
    const { data: authorProfiles } = await supabase
      .from('profiles').select('display_name, photo_url').eq('user_id', post.author_id);
    post.profiles = (authorProfiles || [])[0] || {};

    postCommentCounts[post.id] = 0;
    previewCommentsMap[post.id] = [];

    const feedList = document.getElementById('feed-list');
    const emptyEl = feedList.querySelector('.feed-empty, .feed-loading');
    if (emptyEl) emptyEl.remove();

    const firstNonPinned = feedList.querySelector('.post-card:not([data-pinned])');
    const html = renderPostCard(post, 0, []);
    if (firstNonPinned && !post.is_pinned) {
      firstNonPinned.insertAdjacentHTML('beforebegin', html);
    } else {
      feedList.insertAdjacentHTML('afterbegin', html);
    }

    const newCard = document.getElementById(`post-${post.id}`);
    if (newCard) {
      newCard.querySelectorAll('.reaction-btn').forEach(btn =>
        btn.addEventListener('click', () => toggleReaction(btn.dataset.postId, btn.dataset.reaction, btn))
      );
      newCard.querySelectorAll('.comment-toggle-btn').forEach(btn =>
        btn.addEventListener('click', () => toggleCommentThread(btn.dataset.postId))
      );
      newCard.querySelectorAll('.follow-post-btn').forEach(btn =>
        btn.addEventListener('click', () => toggleFollow(btn))
      );
      if (isAdmin) {
        const delBtn = newCard.querySelector('.post-delete-btn');
        if (delBtn) delBtn.addEventListener('click', () => confirmDeletePost(delBtn));
        const pinBtn = newCard.querySelector('.post-pin-btn');
        if (pinBtn) pinBtn.addEventListener('click', () => togglePinPost(pinBtn));
      }
      wireCommentComposer(post.id);
      attachTooltipListeners(newCard);
      wireAudioPlayers(newCard);
      isFollowingPost(post.id).then(following => {
        const followBtn = newCard.querySelector('.follow-post-btn');
        if (followBtn) updateFollowButtonState(followBtn, following);
      });
    }
  }

  function handleRealtimeDelete(postId) {
    if (!postId) return;
    const el = document.getElementById(`post-${postId}`);
    if (el) el.remove();

    const feedList = document.getElementById('feed-list');
    if (!feedList.querySelector('.post-card')) {
      feedList.innerHTML = `
        <div class="feed-empty">
          <strong>No posts yet</strong>
          Be the first to post in ${activeChannelId ? '#' + activeChannelName : 'the main feed'}.
        </div>`;
    }
  }

  init();
</script>
