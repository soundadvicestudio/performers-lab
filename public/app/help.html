<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Center — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.15);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LAYOUT ── */
  .main { max-width: 820px; margin: 0 auto; padding: 3rem 2rem 4rem; }

  /* ── PAGE HEADER ── */
  .page-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.6rem; }
  .page-heading { font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; font-weight: 400; color: var(--text); line-height: 1.1; margin-bottom: 0.5rem; }
  .page-heading span { color: var(--gold); }
  .page-sub { font-size: 14px; color: var(--text-muted); font-weight: 300; margin-bottom: 2rem; }

  /* ── SEARCH ── */
  .search-wrap {
    position: relative; margin-bottom: 2.5rem;
  }
  .search-input {
    width: 100%; background: var(--bg-2); border: 0.5px solid var(--border-mid);
    color: var(--text); padding: 11px 40px 11px 16px; border-radius: 6px;
    font-size: 14px; font-family: 'Raleway', sans-serif; font-weight: 300;
    transition: border-color 0.2s; outline: none;
  }
  .search-input:focus { border-color: var(--gold); }
  .search-input::placeholder { color: var(--text-dim); }
  .search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; color: var(--text-dim);
    font-size: 18px; line-height: 1; padding: 0; display: none;
    font-family: 'Raleway', sans-serif; transition: color 0.15s;
  }
  .search-clear:hover { color: var(--text-muted); }

  /* ── NO RESULTS ── */
  .no-results {
    display: none; text-align: center; padding: 3rem 1rem;
    font-size: 14px; color: var(--text-dim); font-style: italic;
  }

  /* ── CATEGORY SECTIONS ── */
  .help-cat-section { margin-bottom: 1.5rem; }

  .help-cat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1.25rem; cursor: pointer; user-select: none;
    background: var(--bg-2); border: 0.5px solid var(--border);
    border-radius: 6px; transition: border-color 0.15s;
  }
  .help-cat-header:hover { border-color: var(--border-mid); }
  .help-cat-header.open { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }

  .help-cat-header-left { display: flex; align-items: center; gap: 10px; }
  .help-cat-name {
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .help-cat-count {
    background: var(--gold-dim); color: var(--gold);
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    padding: 2px 8px; border-radius: 10px; border: 0.5px solid var(--border-gold);
  }
  .help-cat-chevron {
    font-size: 12px; color: var(--text-dim);
    transition: transform 0.25s ease;
  }
  .help-cat-header.open .help-cat-chevron { transform: rotate(180deg); }

  /* Smooth accordion body using grid trick */
  .help-cat-body-wrap {
    display: grid; grid-template-rows: 1fr;
    background: var(--bg-2); border: 0.5px solid var(--border);
    border-top: none; border-radius: 0 0 6px 6px;
    overflow: hidden; transition: grid-template-rows 0.25s ease;
  }
  .help-cat-body-wrap.closed { grid-template-rows: 0fr; border-color: transparent; }
  .help-cat-body-inner { overflow: hidden; }
  .help-cat-topics { padding: 4px 0 8px; }

  /* ── TOPIC ROWS ── */
  .help-topic-item { border-top: 0.5px solid var(--border); }
  .help-topic-item:first-child { border-top: none; }

  .help-topic-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 1.25rem; cursor: pointer; gap: 1rem;
    transition: background 0.1s;
  }
  .help-topic-row:hover { background: rgba(240,237,230,0.02); }
  .help-topic-title-text {
    font-size: 14px; font-weight: 500; color: var(--text); flex: 1;
  }
  .topic-chevron {
    font-size: 11px; color: var(--text-dim); flex-shrink: 0;
    transition: transform 0.25s ease;
  }
  .help-topic-item.open .topic-chevron { transform: rotate(180deg); }

  /* Topic content accordion */
  .help-topic-content-wrap {
    display: grid; grid-template-rows: 0fr;
    overflow: hidden; transition: grid-template-rows 0.25s ease;
  }
  .help-topic-item.open .help-topic-content-wrap { grid-template-rows: 1fr; }
  .help-topic-content-inner { overflow: hidden; }
  .help-topic-content {
    padding: 0 1.25rem 1.25rem;
    font-size: 14px; color: var(--text-muted); line-height: 1.7; font-weight: 300;
  }
  .help-topic-content p { margin-bottom: 0.6em; }
  .help-topic-content p:last-child { margin-bottom: 0; }
  .help-topic-content a { color: var(--gold); text-decoration: underline; }
  .help-topic-content a:hover { color: var(--gold-light); }
  .help-topic-content ul, .help-topic-content ol { padding-left: 1.4em; margin-bottom: 0.6em; }
  .help-topic-content li { margin-bottom: 0.25em; }
  .help-topic-content strong { font-weight: 700; color: var(--text); }
  .help-topic-content em { font-style: italic; }
  .help-topic-content blockquote {
    border-left: 2px solid var(--border-gold); padding-left: 1rem;
    margin: 0.75rem 0; color: var(--text-dim); font-style: italic;
  }

  @media (max-width: 600px) {
    .main { padding: 2rem 1.25rem 3rem; }
    .page-heading { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app-nav"></div>
<div id="app-subnav"></div>

<main class="main" id="page-content" style="display:none;">
  <div class="page-eyebrow">Support</div>
  <h1 class="page-heading">Help <span>Center</span></h1>
  <p class="page-sub">Everything you need to know about using The Performer's Lab.</p>

  <div class="search-wrap">
    <input type="search" class="search-input" id="help-search" placeholder="Search help topics…" autocomplete="off">
    <button class="search-clear" id="help-search-clear" aria-label="Clear search">×</button>
  </div>

  <div class="no-results" id="help-no-results">
    No topics found for "<span id="help-search-term"></span>".
  </div>

  <div id="help-content"></div>
</main>

<div id="app-footer"></div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { initFooter } from './components/footer.js';
  import { applyTheme } from './components/theme.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  // ── sanitizeHTML — copied verbatim from community.html ──────────────────
  function sanitizeHTML(html) {
    const ALLOWED = new Set(['b','i','u','strong','em','a','ul','ol','li','p','br','span']);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    function clean(node) {
      const toUnwrap = [];
      for (const child of [...node.childNodes]) {
        if (child.nodeType !== Node.ELEMENT_NODE) continue;
        const tag = child.tagName.toLowerCase();
        if (!ALLOWED.has(tag)) { toUnwrap.push(child); continue; }
        if (tag === 'span') {
          if (child.classList.contains('mention-chip') && child.dataset.userId && child.dataset.displayName) {
            for (const attr of [...child.attributes]) {
              if (!['class','data-user-id','data-display-name','contenteditable','style'].includes(attr.name)) {
                child.removeAttribute(attr.name);
              }
            }
          } else {
            toUnwrap.push(child);
            continue;
          }
        } else {
          for (const attr of [...child.attributes]) {
            if (tag === 'a' && attr.name === 'href' && /^(https?:|\/|#)/.test(attr.value)) continue;
            child.removeAttribute(attr.name);
          }
        }
        clean(child);
      }
      for (const el of toUnwrap) {
        while (el.firstChild) node.insertBefore(el.firstChild, el);
        node.removeChild(el);
      }
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  // ── Blockquote is not in ALLOWED above, add it for help content ─────────
  // Override: help.html content uses blockquote which is safe read-only HTML
  function sanitizeHelpHTML(html) {
    const ALLOWED = new Set(['b','i','u','strong','em','a','ul','ol','li','p','br','blockquote']);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    function clean(node) {
      const toUnwrap = [];
      for (const child of [...node.childNodes]) {
        if (child.nodeType !== Node.ELEMENT_NODE) continue;
        const tag = child.tagName.toLowerCase();
        if (!ALLOWED.has(tag)) { toUnwrap.push(child); continue; }
        for (const attr of [...child.attributes]) {
          if (tag === 'a' && attr.name === 'href' && /^(https?:|\/|#)/.test(attr.value)) continue;
          child.removeAttribute(attr.name);
        }
        clean(child);
      }
      for (const el of toUnwrap) {
        while (el.firstChild) node.insertBefore(el.firstChild, el);
        node.removeChild(el);
      }
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── State ────────────────────────────────────────────────────────────────
  let allCategories = [];
  let allTopics = [];

  // ── Init ─────────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }

    const { data: profile } = await supabase
      .from('profiles')
      .select('display_name, theme, is_admin, timezone')
      .eq('user_id', session.user.id)
      .single();

    applyTheme(profile?.theme || 'gold');
    initNav(supabase, {
      userName: profile?.display_name || session.user.email.split('@')[0],
      isAdmin: profile?.is_admin || false
    });
    initSubnav(null, supabase);
    initFooter();

    const [{ data: cats }, { data: topics }] = await Promise.all([
      supabase.from('help_categories').select('*').order('position', { ascending: true }),
      supabase.from('help_topics').select('*').eq('published', true).order('position', { ascending: true })
    ]);

    allCategories = cats || [];
    allTopics = topics || [];

    renderHelpContent(allCategories, allTopics);
    wireSearch();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page-content').style.display = '';
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function renderHelpContent(cats, topics) {
    const container = document.getElementById('help-content');

    // Group topics by category
    const grouped = {};
    cats.forEach(c => { grouped[c.id] = []; });
    topics.forEach(t => { if (grouped[t.category_id] !== undefined) grouped[t.category_id].push(t); });

    // Only show categories with at least one topic
    const activeCats = cats.filter(c => (grouped[c.id] || []).length > 0);

    if (!activeCats.length) {
      container.innerHTML = '<div style="text-align:center;padding:3rem 1rem;font-size:14px;color:var(--text-dim);font-style:italic;">No help topics available yet.</div>';
      return;
    }

    let html = '';
    activeCats.forEach(cat => {
      const catTopics = grouped[cat.id];
      const catId = escapeHtml(cat.id);
      html += `
        <div class="help-cat-section" data-cat-id="${catId}">
          <div class="help-cat-header open" onclick="toggleCatSection(this)" data-cat-id="${catId}">
            <div class="help-cat-header-left">
              <span class="help-cat-name">${escapeHtml(cat.name)}</span>
              <span class="help-cat-count">${catTopics.length}</span>
            </div>
            <span class="help-cat-chevron">⌄</span>
          </div>
          <div class="help-cat-body-wrap" id="help-cat-body-${catId}">
            <div class="help-cat-body-inner">
              <div class="help-cat-topics">`;

      catTopics.forEach(topic => {
        const tId = escapeHtml(topic.id);
        html += `
                <div class="help-topic-item" id="help-topic-${tId}" data-topic-id="${tId}" data-title="${escapeHtml(topic.title.toLowerCase())}">
                  <div class="help-topic-row" onclick="toggleTopic('${tId}')">
                    <span class="help-topic-title-text">${escapeHtml(topic.title)}</span>
                    <span class="topic-chevron">⌄</span>
                  </div>
                  <div class="help-topic-content-wrap">
                    <div class="help-topic-content-inner">
                      <div class="help-topic-content">${sanitizeHelpHTML(topic.content || '')}</div>
                    </div>
                  </div>
                </div>`;
      });

      html += `
              </div>
            </div>
          </div>
        </div>`;
    });

    container.innerHTML = html;
  }

  // ── Accordion toggles ────────────────────────────────────────────────────
  window.toggleCatSection = function(headerEl) {
    const isOpen = headerEl.classList.contains('open');
    const catId = headerEl.dataset.catId;
    const body = document.getElementById(`help-cat-body-${catId}`);
    if (isOpen) {
      headerEl.classList.remove('open');
      body.classList.add('closed');
    } else {
      headerEl.classList.add('open');
      body.classList.remove('closed');
    }
  };

  window.toggleTopic = function(topicId) {
    const item = document.getElementById(`help-topic-${topicId}`);
    if (!item) return;
    const isOpen = item.classList.contains('open');
    // Collapse all other open topics
    document.querySelectorAll('.help-topic-item.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  };

  // ── Search ────────────────────────────────────────────────────────────────
  function wireSearch() {
    const input = document.getElementById('help-search');
    const clearBtn = document.getElementById('help-search-clear');
    const noResults = document.getElementById('help-no-results');
    const termSpan = document.getElementById('help-search-term');

    input.addEventListener('input', () => {
      const term = input.value.trim().toLowerCase();
      clearBtn.style.display = term ? 'block' : 'none';

      if (!term) {
        noResults.style.display = 'none';
        // Show all sections and topics
        document.querySelectorAll('.help-cat-section').forEach(s => s.style.display = '');
        document.querySelectorAll('.help-topic-item').forEach(t => t.style.display = '');
        return;
      }

      termSpan.textContent = input.value.trim();
      let anyVisible = false;

      document.querySelectorAll('.help-cat-section').forEach(section => {
        let sectionHasMatch = false;
        section.querySelectorAll('.help-topic-item').forEach(item => {
          const title = item.dataset.title || '';
          const matches = title.includes(term);
          item.style.display = matches ? '' : 'none';
          if (matches) sectionHasMatch = true;
        });
        section.style.display = sectionHasMatch ? '' : 'none';
        if (sectionHasMatch) anyVisible = true;
      });

      noResults.style.display = anyVisible ? 'none' : 'block';
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      clearBtn.style.display = 'none';
      noResults.style.display = 'none';
      document.querySelectorAll('.help-cat-section').forEach(s => s.style.display = '');
      document.querySelectorAll('.help-topic-item').forEach(t => t.style.display = '');
      input.focus();
    });
  }

  init();
</script>
</body>
</html>
