  .event-desc { font-size: 15px; color: var(--text-muted); font-weight: 300; line-height: 1.7; }

  .time-local { font-size: 12px; color: var(--text-dim); font-weight: 300; }

</style>

  let messages = [];
  let profileMap = {};
  let perEventModIds = new Set();
  let participantIds = new Set();
  let chatMessagesEl = null;
  let chatErrorTimeout = null;

  // ── Helpers ─────────────────────────────────────────────────────────────
  function isProfileComplete(profile) {
    return !!(profile?.display_name?.trim() && profile?.birth_year &&
      profile?.experience?.trim() && profile?.location?.trim() &&
      profile?.bio?.trim() && profile?.timezone?.trim());
  }

  function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatCtDate(iso) {
    if (!iso) return '—';
    return new Intl.DateTimeFormat('en-US',{
      timeZone:'America/Chicago', weekday:'long', month:'long', day:'numeric',
      hour:'numeric', minute:'2-digit', hour12:true,
    }).format(new Date(iso)) + ' CT';
  }

  function formatLocalTime(iso, tz) {
    const d = new Date(iso);
    const timePart = new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'numeric',minute:'2-digit',hour12:true}).format(d);
    const short = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(d).find(p=>p.type==='timeZoneName')?.value||'';
    const long  = new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'long'}).formatToParts(d).find(p=>p.type==='timeZoneName')?.value||'';
    return `${timePart} your time (${long} · ${short})`;
  }

  function toIcsDate(d) { return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''); }
  function slugify(s) { return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

  function extractYouTubeId(url) {
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
      if (u.hostname==='youtu.be') return u.pathname.slice(1).split('/')[0]||null;
    } catch(e) {}
    return null;
  }

  function convertDriveUrl(url) { return url.replace(/\/view(\?.*)?$/,'/preview'); }

  function downloadIcs(evt) {
    const now=toIcsDate(new Date()), start=toIcsDate(new Date(evt.starts_at));
    const end=toIcsDate(new Date(new Date(evt.starts_at).getTime()+90*60000));
    const desc=`${(evt.topic||'').replace(/\n/g,'\\n')}\\n\\n${(evt.description||'').replace(/\n/g,'\\n')}`;
    const ics=['BEGIN:VCALENDAR','VERSION:2.0',"PRODID:-//The Performer's Lab//EN",
      'BEGIN:VEVENT',`UID:${evt.id}@performers-lab.com`,`DTSTAMP:${now}`,
      `DTSTART:${start}`,`DTEND:${end}`,`SUMMARY:${evt.title} — The Performer's Lab`,
      `DESCRIPTION:${desc}`,`URL:https://performers-lab.com/app/event.html?id=${evt.id}`,
      'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`performers-lab-${slugify(evt.title)}.ics`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  }

  // ── Event page rendering ────────────────────────────────────────────────
  function buildStatusBadge(status) {
    if (status==='live') return `<div class="badge badge-live"><span class="live-dot"></span>&nbsp;Live Now</div>`;
    if (status==='upcoming') return `<div class="badge badge-upcoming">Upcoming</div>`;
    return `<div class="badge badge-completed">Completed</div>`;
  }

  function buildTimeBlock(event) {
    if (event.status==='completed') return '';
    const tz=userProfile?.timezone, showLocal=tz&&tz!=='America/Chicago';
    return `<div class="event-time-block" id="event-time-block">
      <div class="time-primary">${formatCtDate(event.starts_at)}</div>
      ${showLocal?`<div class="time-local">${escHtml(formatLocalTime(event.starts_at,tz))}</div>`:''}
    </div>`;
  }

  function buildRsvpSection(event) {
    if (event.status!=='upcoming') return '';
    const hasRsvp=!!currentRsvp, hasNotify=currentRsvp?.notify===true;
    return `<div class="rsvp-section" id="rsvp-section">
      <div class="rsvp-row">
        <button class="btn-rsvp${hasRsvp?' rsvpd':''}" id="btn-rsvp" onclick="window.toggleRsvp()">
          ${hasRsvp?"RSVP'd ✓":'RSVP'}
        </button>
        <button class="btn-notify${hasNotify?' notified':''}" id="btn-notify" ${!hasRsvp?'disabled':''} onclick="window.toggleNotify()">
          ${hasNotify?'Notified 🔔':'Notify Me 🔔'}
        </button>
        <span class="rsvp-count" id="rsvp-count">${currentRsvpCount} going</span>
      </div>
      <div class="rsvp-hint">RSVP to get a 24-hour reminder · Notify Me for a morning-of reminder</div>
      <button class="btn-cal" onclick="window.triggerIcsDownload()">Add to Calendar</button>
    </div>`;
  }

  function buildEmbed(event) {
    if (event.status==='upcoming') {
      return `<div class="embed-placeholder">
        <div class="embed-placeholder-icon"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
        <div class="embed-placeholder-text">This session hasn't started yet.</div>
        <div class="embed-placeholder-sub">${formatCtDate(event.starts_at)}</div>
      </div>`;
    }
    if (event.status==='live') {
      if (!event.daily_room_url) return `<div class="embed-placeholder"><div class="embed-placeholder-text">Session starting…</div></div>`;
      let src=event.daily_room_url+'?camera=off&microphone=off';
      if (userIsAdmin) { const t=sessionStorage.getItem(`host_token_${event.id}`); if(t) src=`${event.daily_room_url}?t=${t}&camera=off&microphone=off`; }
      return `<div class="embed-container"><iframe id="daily-frame" src="${escHtml(src)}" allow="camera; microphone; fullscreen; display-capture" style="width:100%;height:100%;border:none;"></iframe></div>`;
    }
    if (event.status==='completed') {
      if (!event.recording_url) return `<div class="embed-placeholder"><div class="embed-placeholder-icon"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg></div><div class="embed-placeholder-text">Recording coming soon.</div></div>`;
      const ytId=extractYouTubeId(event.recording_url);
      if (ytId) return `<div class="embed-container"><iframe src="https://www.youtube.com/embed/${escHtml(ytId)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="width:100%;height:100%;border:none;"></iframe></div>`;
      if (event.recording_url.includes('drive.google.com')) return `<div class="embed-container"><iframe src="${escHtml(convertDriveUrl(event.recording_url))}" allow="autoplay" allowfullscreen style="width:100%;height:100%;border:none;"></iframe></div>`;
      return `<div class="embed-placeholder"><div class="embed-placeholder-text">Session recording available</div><a href="${escHtml(event.recording_url)}" class="embed-ext-link" target="_blank" rel="noopener noreferrer">Watch Recording →</a></div>`;
    }
    return '';
  }

  function buildAdminControls(event) {
    if (!userIsAdmin || event.status==='completed') return '';
    const showGoLive = event.status==='upcoming';
    const showEndSession = event.status==='live';
    return `<div id="admin-control-bar" class="admin-ctrl-wrap">
      <div class="admin-ctrl-bar">
        <span class="admin-ctrl-label">Admin Controls</span>
        <div class="admin-ctrl-actions">
          ${showGoLive?`<button class="btn-go-live" id="btn-go-live" onclick="window.handleGoLive()">⚡ Go Live</button>`:''}
          ${showEndSession?`<button class="btn-end-session" id="btn-end-session" onclick="window.handleEndSession()">■ End Session</button>`:''}
        </div>
      </div>
      <div id="admin-end-confirm" class="admin-end-confirm" style="display:none;">
        <span>End this session and mark as completed?</span>
        <button class="admin-end-confirm-yes" id="btn-end-confirm-yes" onclick="window.confirmEndSession()">End Session</button>
        <button class="admin-end-confirm-cancel" onclick="document.getElementById('admin-end-confirm').style.display='none'">Cancel</button>
      </div>
    </div>`;
  }

  function renderPage() {
    const event=currentEvent;
    document.getElementById('event-main').innerHTML=`
      <div class="event-info-card${event.status==='live'?' live':''}" id="event-info-card">
        <div id="event-status-badge">${buildStatusBadge(event.status)}</div>
        <div class="event-title">${escHtml(event.title)}</div>
        <div class="event-topic">${escHtml(event.topic)}</div>
        ${buildTimeBlock(event)}
        <div class="event-desc">${escHtml(event.description)}</div>
        ${buildRsvpSection(event)}
      </div>
      ${buildAdminControls(event)}
      <div id="event-embed-area">${buildEmbed(event)}</div>`;
  }

  function applyStatusUpdate(updatedEvent) {
    currentEvent={...currentEvent,...updatedEvent};
    const event=currentEvent;
    document.title=`${event.title} — The Performer's Lab`;
    const badgeEl=document.getElementById('event-status-badge');
    if (badgeEl) badgeEl.innerHTML=buildStatusBadge(event.status);
    const card=document.getElementById('event-info-card');
    if (card) card.classList.toggle('live',event.status==='live');
    const timeEl=document.getElementById('event-time-block');
    const newTime=buildTimeBlock(event);
    if (timeEl) { if(newTime) timeEl.outerHTML=newTime; else timeEl.remove(); }
    else { const d=document.querySelector('.event-desc'); if(d&&newTime) d.insertAdjacentHTML('beforebegin',newTime); }
    const rsvpEl=document.getElementById('rsvp-section');
    if (event.status!=='upcoming'&&rsvpEl) rsvpEl.remove();
    const embedEl=document.getElementById('event-embed-area');
    if (embedEl) embedEl.innerHTML=buildEmbed(event);
    const adminCtrl=document.getElementById('admin-control-bar');
    if (adminCtrl) {
      const wrapper=document.createElement('div'); wrapper.innerHTML=buildAdminControls(event);
      const newEl=wrapper.firstElementChild;
      if (newEl) adminCtrl.replaceWith(newEl); else adminCtrl.remove();
    }
    updateChatStateForStatus(event.status);
  }

  // ── RSVP handlers ───────────────────────────────────────────────────────
  window.triggerIcsDownload=function(){ if(currentEvent) downloadIcs(currentEvent); };

  window.toggleRsvp=async function(){
    const btn=document.getElementById('btn-rsvp');
    const notifyBtn=document.getElementById('btn-notify');
    const countEl=document.getElementById('rsvp-count');
    if(!btn) return;
    const hasRsvp=!!currentRsvp;
    if (hasRsvp) {
      btn.disabled=true;
      const {error}=await supabase.from('event_rsvps').delete().eq('event_id',eventId).eq('user_id',currentUserId);
      btn.disabled=false; if(error) return;
      currentRsvp=null; currentRsvpCount=Math.max(0,currentRsvpCount-1);
      btn.className='btn-rsvp'; btn.textContent='RSVP';
      if(notifyBtn){notifyBtn.disabled=true;notifyBtn.className='btn-notify';notifyBtn.textContent='Notify Me 🔔';}
      if(countEl) countEl.textContent=`${currentRsvpCount} going`;
    } else {
      btn.disabled=true;
      const {error}=await supabase.from('event_rsvps').upsert({event_id:eventId,user_id:currentUserId,notify:false},{onConflict:'event_id,user_id',ignoreDuplicates:true});
      btn.disabled=false; if(error) return;
      currentRsvp={notify:false}; currentRsvpCount+=1;
      btn.className='btn-rsvp rsvpd'; btn.textContent="RSVP'd ✓";
      if(notifyBtn) notifyBtn.disabled=false;
      if(countEl) countEl.textContent=`${currentRsvpCount} going`;
    }
  };

  window.toggleNotify=async function(){
    if(!currentRsvp) return;
    const btn=document.getElementById('btn-notify');
    if(!btn||btn.disabled) return;
    const newNotify=!(currentRsvp.notify===true);
    btn.disabled=true;
    const {error}=await supabase.from('event_rsvps').update({notify:newNotify}).eq('event_id',eventId).eq('user_id',currentUserId);
    btn.disabled=false; if(error) return;
    currentRsvp.notify=newNotify;
    btn.className=newNotify?'btn-notify notified':'btn-notify';
    btn.textContent=newNotify?'Notified 🔔':'Notify Me 🔔';
  };

  // ── Chat: render ────────────────────────────────────────────────────────
  function buildAvatar(profile) {
    if (profile?.photo_url)
      return `<img class="chat-avatar-img" src="${escHtml(profile.photo_url)}" alt="">`;
    const init=escHtml((profile?.display_name||'M')[0].toUpperCase());
    return `<div class="chat-avatar-init">${init}</div>`;
  }

  function renderMessage(msg, profile, isPerEventMod) {
    const name=escHtml(profile?.display_name||'Member');
    const isAuthorAdmin=!!profile?.is_admin;
    const isAuthorGlobalMod=!!profile?.is_moderator;
    const isMod=isAuthorGlobalMod||isPerEventMod;
    const canModerate=userIsAdmin||userProfile?.is_moderator||perEventModIds.has(currentUserId);
    const safeId=escHtml(msg.id), safeUid=escHtml(msg.user_id);

    const coachBadge=isAuthorAdmin?`<span class="chat-badge chat-badge-coach">Coach</span>`:'';
    const modBadge=isMod?`<span class="chat-badge chat-badge-mod">Mod</span>`:'';

    let actionIcons='';
    if (canModerate) {
      const deleteBtn=`<button class="chat-action-btn chat-action-delete" title="Delete message" onclick="window.deleteMessage('${safeId}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></button>`;
      let modBtn='';
      if (userIsAdmin && !isAuthorAdmin && !isAuthorGlobalMod) {
        if (!isPerEventMod) {
          modBtn=`<button class="chat-action-btn chat-action-appoint" title="Appoint as moderator" onclick="window.showAppointConfirm('${safeId}','${safeUid}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></button>`;
        } else {
          modBtn=`<button class="chat-action-btn chat-action-remove-mod" title="Remove moderator" onclick="window.showRemoveModConfirm('${safeId}','${safeUid}')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>`;
        }
      }
      actionIcons=`<div class="chat-action-icons">${modBtn}${deleteBtn}</div>`;
    }

    return `<div class="chat-msg" data-message-id="${safeId}" data-author-id="${safeUid}">
      <div class="chat-msg-avatar">${buildAvatar(profile)}</div>
      <div class="chat-msg-body">
        <div class="chat-msg-meta">
          <span class="chat-msg-name">${name}</span>
          ${coachBadge}${modBadge}
          <span class="chat-msg-time">${relativeTime(msg.created_at)}</span>
          ${actionIcons}
        </div>
        <div class="chat-msg-text">${escHtml(msg.content)}</div>
      </div>
    </div>`;
  }

  // ── Chat: participant count ─────────────────────────────────────────────
  function renderParticipantCount() {
    const el=document.getElementById('chat-participant-count');
    if (!el) return;
    const n=participantIds.size;
    el.textContent=n===0?'':(n===1?'1 in the chat':`${n} in the chat`);
  }

  function updateParticipantCount(userId) {
    participantIds.add(userId);
    renderParticipantCount();
  }

  // ── Chat: state helpers ─────────────────────────────────────────────────
  function updateChatStateForStatus(status) {
    const inputRow=document.getElementById('chat-input-row');
    const banner=document.getElementById('chat-readonly-banner');
    if (!inputRow||!banner) return;
    if (status==='live')       { inputRow.style.display=''; banner.style.display='none'; }
    else if (status==='completed') { inputRow.style.display='none'; banner.style.display=''; }
    else                           { inputRow.style.display='none'; banner.style.display='none'; }
  }

  function showChatError(msg) {
    const el=document.getElementById('chat-error');
    if (!el) return;
    el.textContent=msg; el.style.display='block';
    clearTimeout(chatErrorTimeout);
    chatErrorTimeout=setTimeout(()=>{ el.style.display='none'; el.textContent=''; },3000);
  }

  function clearAllChatConfirms() {
    document.querySelectorAll('.chat-confirm').forEach(el=>el.remove());
  }

  function refreshMessagesByUser(userId) {
    messages.filter(m=>m.user_id===userId).forEach(msg=>{
      const el=document.querySelector(`[data-message-id="${msg.id}"]`);
      if (!el) return;
      const profile=profileMap[userId]||{display_name:'Member',photo_url:null,is_admin:false,is_moderator:false};
      const isPerEventMod=perEventModIds.has(userId);
      const wrapper=document.createElement('div');
      wrapper.innerHTML=renderMessage(msg,profile,isPerEventMod);
      const newEl=wrapper.firstElementChild;
      if (newEl) el.replaceWith(newEl);
    });
  }

  // ── Chat: init ──────────────────────────────────────────────────────────
  function initChat(msgs, mods) {
    chatMessagesEl=document.getElementById('chat-messages');
    if (!chatMessagesEl) return;

    (mods||[]).forEach(m=>perEventModIds.add(m.user_id));
    messages=msgs||[];
    participantIds=new Set(messages.map(m=>m.user_id));
    renderParticipantCount();

    if (!messages.length) {
      const txt=currentEvent.status==='live'?'Be the first to say something.':'No messages yet.';
      chatMessagesEl.innerHTML=`<div class="chat-empty" id="chat-empty">${txt}</div>`;
    } else {
      messages.forEach(msg=>{
        const profile=profileMap[msg.user_id]||null;
        const el=document.createElement('div');
        el.innerHTML=renderMessage(msg,profile,perEventModIds.has(msg.user_id));
        const child=el.firstElementChild;
        if (child) chatMessagesEl.appendChild(child);
      });
      chatMessagesEl.scrollTop=chatMessagesEl.scrollHeight;
    }

    updateChatStateForStatus(currentEvent.status);

    const chatInput=document.getElementById('chat-input');
    const sendBtn=document.getElementById('chat-send-btn');
    if (chatInput&&sendBtn) {
      const sendMessage=async()=>{
        if (currentEvent.status!=='live') return;
        const content=chatInput.value.trim();
        if (!content) return;
        if (containsProfanity(content)) { showChatError('Your message contains restricted content.'); return; }
        sendBtn.disabled=true;
        const {error}=await supabase.from('event_messages').insert({event_id:eventId,user_id:currentUserId,content});
        sendBtn.disabled=false;
        if (error) { showChatError('Failed to send. Try again.'); return; }
        chatInput.value='';
      };
      sendBtn.addEventListener('click',sendMessage);
      chatInput.addEventListener('keydown',e=>{
        if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(); }
      });
    }
  }

  // ── Mod: appoint ───────────────────────────────────────────────────────
  window.showAppointConfirm=function(msgId, authorId) {
    clearAllChatConfirms();
    const msgEl=document.querySelector(`[data-message-id="${msgId}"]`);
    if (!msgEl) return;
    const displayName=escHtml(profileMap[authorId]?.display_name||'this member');
    const confirm=document.createElement('div');
    confirm.className='chat-confirm';
    confirm.innerHTML=`<span>Appoint <strong>${displayName}</strong> as session moderator?</span>
      <button class="chat-confirm-btn chat-confirm-gold" onclick="window.doAppointMod('${escHtml(authorId)}','${escHtml(msgId)}',this)">Appoint</button>
      <button class="chat-confirm-btn chat-confirm-cancel" onclick="this.closest('.chat-confirm').remove()">Cancel</button>`;
    msgEl.querySelector('.chat-msg-body')?.appendChild(confirm);
  };

  window.doAppointMod=async function(authorId, triggerMsgId, btn) {
    btn.disabled=true; btn.textContent='Appointing…';
    const {error}=await supabase.from('event_moderators').insert({event_id:eventId,user_id:authorId,appointed_by:currentUserId});
    if (error) {
      btn.disabled=false; btn.textContent='Appoint';
      showChatError('Failed to appoint moderator.'); return;
    }
    await supabase.from('notifications').insert({
      user_id:authorId, type:'mod_appointed',
      title:"You've been appointed as a moderator",
      body:`Jonathan has appointed you as a moderator for ${currentEvent.title}. You can now delete chat messages during this session.`,
      link:`/app/event.html?id=${eventId}`, read:false,
    });
    perEventModIds.add(authorId);
    clearAllChatConfirms();
    refreshMessagesByUser(authorId);
  };

  // ── Mod: remove ─────────────────────────────────────────────────────────
  window.showRemoveModConfirm=function(msgId, authorId) {
    clearAllChatConfirms();
    const msgEl=document.querySelector(`[data-message-id="${msgId}"]`);
    if (!msgEl) return;
    const displayName=escHtml(profileMap[authorId]?.display_name||'this member');
    const confirm=document.createElement('div');
    confirm.className='chat-confirm';
    confirm.innerHTML=`<span>Remove <strong>${displayName}</strong> as moderator?</span>
      <button class="chat-confirm-btn chat-confirm-danger" onclick="window.doRemoveMod('${escHtml(authorId)}',this)">Remove</button>
      <button class="chat-confirm-btn chat-confirm-cancel" onclick="this.closest('.chat-confirm').remove()">Cancel</button>`;
    msgEl.querySelector('.chat-msg-body')?.appendChild(confirm);
  };

  window.doRemoveMod=async function(authorId, btn) {
    btn.disabled=true; btn.textContent='Removing…';
    const {error}=await supabase.from('event_moderators').delete().eq('event_id',eventId).eq('user_id',authorId);
    if (error) {
      btn.disabled=false; btn.textContent='Remove';
      showChatError('Failed to remove moderator.'); return;
    }
    perEventModIds.delete(authorId);
    clearAllChatConfirms();
    refreshMessagesByUser(authorId);
  };

  // ── Mod: delete message ─────────────────────────────────────────────────
  window.deleteMessage=async function(msgId) {
    const el=document.querySelector(`[data-message-id="${msgId}"]`);
    if (el) { el.style.transition='opacity 0.3s'; el.style.opacity='0'; }
    const {error}=await supabase.from('event_messages').delete().eq('id',msgId);
    if (error) {
      if (el) { el.style.opacity='1'; }
      showChatError('Failed to delete message.');
    } else {
      if (el) setTimeout(()=>{el.remove(); messages=messages.filter(m=>m.id!==msgId);},300);
    }
  };

  // ── Realtime subscriptions ──────────────────────────────────────────────
  function subscribeToEventUpdates() {
    supabase.channel(`event-status-${eventId}`)
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'events',filter:`id=eq.${eventId}`},
        payload=>applyStatusUpdate(payload.new))
      .subscribe();
    window.addEventListener('beforeunload',()=>supabase.removeAllChannels());
  }

  function subscribeToChatUpdates() {
    // A — new messages
    supabase.channel(`event-messages-${eventId}`)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'event_messages',filter:`event_id=eq.${eventId}`},
        async payload=>{
          const msg=payload.new;
          if (!profileMap[msg.user_id]) {
            const {data}=await supabase.from('profiles').select('user_id,display_name,photo_url,is_admin,is_moderator').eq('user_id',msg.user_id).single();
            if (data) profileMap[data.user_id]=data;
          }
          const profile=profileMap[msg.user_id]||{display_name:'Member',photo_url:null,is_admin:false,is_moderator:false};
          const isPerEventMod=perEventModIds.has(msg.user_id);
          const html=renderMessage(msg,profile,isPerEventMod);
          document.getElementById('chat-empty')?.remove();
          const wrapper=document.createElement('div');
          wrapper.innerHTML=html;
          const child=wrapper.firstElementChild;
          if (child&&chatMessagesEl) chatMessagesEl.appendChild(child);
          if (chatMessagesEl) chatMessagesEl.scrollTop=chatMessagesEl.scrollHeight;
          messages.push(msg);
          updateParticipantCount(msg.user_id);
        })
      .subscribe();

    // B — deleted messages
    supabase.channel(`event-messages-delete-${eventId}`)
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'event_messages',filter:`event_id=eq.${eventId}`},
        payload=>{
          const el=document.querySelector(`[data-message-id="${payload.old.id}"]`);
          if (el) { el.style.transition='opacity 0.3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }
          messages=messages.filter(m=>m.id!==payload.old.id);
        })
      .subscribe();

    // C — moderator changes
    supabase.channel(`event-mods-${eventId}`)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'event_moderators',filter:`event_id=eq.${eventId}`},
        payload=>{ perEventModIds.add(payload.new.user_id); refreshMessagesByUser(payload.new.user_id); })
      .on('postgres_changes',{event:'DELETE',schema:'public',table:'event_moderators',filter:`event_id=eq.${eventId}`},
        payload=>{ perEventModIds.delete(payload.old.user_id); refreshMessagesByUser(payload.old.user_id); })
      .subscribe();
  }

  // ── Toast ───────────────────────────────────────────────────────────────
  let toastTimeout = null;
  function showToast(msg) {
    const el=document.getElementById('event-toast');
    if (!el) return;
    el.textContent=msg; el.classList.add('visible');
    clearTimeout(toastTimeout);
    toastTimeout=setTimeout(()=>el.classList.remove('visible'),3000);
  }

  // ── Admin Go Live / End Session ─────────────────────────────────────────
  window.handleGoLive=async function() {
    const btn=document.getElementById('btn-go-live');
    if (btn) { btn.disabled=true; btn.textContent='Going live…'; }

    if (currentEvent?.type === 'private') {
      // Private session: room already exists — get a host token and set status to live
      const {data:{session}}=await supabase.auth.getSession();
      if (!session) { if(btn){btn.disabled=false;btn.textContent='⚡ Go Live';} return; }
      const res=await fetch('/api/sessions/getHostToken',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`},
        body:JSON.stringify({eventId}),
      });
      const json=await res.json();
      if (!res.ok) {
        if (btn) { btn.disabled=false; btn.textContent='⚡ Go Live'; }
        showToast('Error: '+(json.error||'Failed to start session'));
        return;
      }
      if (json.token) sessionStorage.setItem(`host_token_${eventId}`, json.token);
      // Patch status to live — Realtime subscription fires and swaps the embed
      await supabase.from('events').update({status:'live'}).eq('id',eventId);
      showToast('Session is live');
    } else {
      // Group session: create a new Daily.co room via createRoom.js
      const {data:{user}}=await supabase.auth.getUser();
      if (!user) { if(btn){btn.disabled=false;btn.textContent='⚡ Go Live';} return; }
      const res=await fetch('/api/events/createRoom',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({admin_user_id:user.id, event_id:eventId}),
      });
      const json=await res.json();
      if (!res.ok) {
        if (btn) { btn.disabled=false; btn.textContent='⚡ Go Live'; }
        showToast('Error: '+(json.error||'Failed to create room'));
        return;
      }
      if (json.host_token) sessionStorage.setItem(`host_token_${eventId}`, json.host_token);
      showToast('Session is live');
      // Realtime subscription on events UPDATE fires and swaps the embed automatically
    }
  };

  window.handleEndSession=function() {
    const confirm=document.getElementById('admin-end-confirm');
    if (confirm) confirm.style.display='';
  };

  window.confirmEndSession=async function() {
    const yesBtn=document.getElementById('btn-end-confirm-yes');
    if (yesBtn) { yesBtn.disabled=true; yesBtn.textContent='Ending…'; }
    const {error}=await supabase.from('events')
      .update({status:'completed', daily_room_url:null}).eq('id',eventId);
    if (error) {
      if (yesBtn) { yesBtn.disabled=false; yesBtn.textContent='End Session'; }
      showToast('Failed to end session.');
      return;
    }
    showToast('Session ended');
    // Realtime subscription handles embed swap and chat state
  };

  // ── Init ────────────────────────────────────────────────────────────────
  async function init() {
    if (!eventId) return;
    const {data:{session}}=await supabase.auth.getSession();
    if (!session) { location.href='/app/login.html'; return; }
    currentUserId=session.user.id;

    const {data:profile}=await supabase.from('profiles')
      .select('display_name,is_admin,is_moderator,theme,bio,location,birth_year,experience,timezone')
      .eq('user_id',currentUserId).single();

    if (!profile?.is_admin&&!isProfileComplete(profile)) { location.href='/app/profile.html?onboarding=true'; return; }
    if (!profile?.is_admin) {
      const {data:membership}=await supabase.from('memberships').select('status').eq('user_id',currentUserId).single();
      if (membership?.status!=='active'&&membership?.status!=='cancelling') { location.href='/app/gate.html'; return; }
    }

    userProfile=profile; userIsAdmin=!!profile?.is_admin;
    applyTheme(profile?.theme||'gold');
    initNav(supabase,{userName:profile?.display_name||session.user.email.split('@')[0],isAdmin:profile?.is_admin});
    initSubnav('live-lab', supabase);
    initFooter();

    const [
      {data:eventData},{data:myRsvpData},{count:rsvpCount},
      {data:chatMsgs},{data:eventMods},
    ]=await Promise.all([
      supabase.from('events').select('*').eq('id',eventId).single(),
      supabase.from('event_rsvps').select('notify').eq('event_id',eventId).eq('user_id',currentUserId).maybeSingle(),
      supabase.from('event_rsvps').select('*',{count:'exact',head:true}).eq('event_id',eventId),
      supabase.from('event_messages').select('*').eq('event_id',eventId).order('created_at',{ascending:true}).limit(100),
      supabase.from('event_moderators').select('*').eq('event_id',eventId),
    ]);

    if (!eventData) { location.href='/app/events.html'; return; }

    // Profile join for chat
    const authorIds=[...new Set([...(chatMsgs||[]).map(m=>m.user_id),...(eventMods||[]).map(m=>m.user_id)])];
    if (authorIds.length) {
      const {data:profiles}=await supabase.from('profiles')
        .select('user_id,display_name,photo_url,is_admin,is_moderator').in('user_id',authorIds);
      (profiles||[]).forEach(p=>{ profileMap[p.user_id]=p; });
    }

    currentEvent=eventData; currentRsvp=myRsvpData||null; currentRsvpCount=rsvpCount||0;
    document.title=`${eventData.title} — The Performer's Lab`;

    renderPage();
    initChat(chatMsgs||[],eventMods||[]);
    subscribeToEventUpdates();
    subscribeToChatUpdates();

    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
  }

  init();
</script>
</body>
