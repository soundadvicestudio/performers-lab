<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Announcements — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .main { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-dim); text-decoration: none; margin-bottom: 2rem; transition: color 0.2s;
  }
  .back-link:hover { color: var(--gold); }
  .back-link::before { content: '←'; font-size: 13px; }

  .page-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.5rem; }
  .page-heading { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 400; color: var(--text); line-height: 1.1; margin-bottom: 0.4rem; }
  .page-sub { font-size: 14px; color: var(--text-muted); font-weight: 300; margin-bottom: 2.5rem; }

  .ann-list { display: flex; flex-direction: column; gap: 1rem; }

  .ann-card {
    border-radius: 8px; padding: 1.5rem 1.75rem;
    border-left: 3px solid var(--border);
    background: var(--bg);
    transition: border-color 0.2s;
  }
  .ann-card.unread {
    background: var(--bg-2);
    border-left-color: var(--gold);
  }

  .ann-card-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; margin-bottom: 0.5rem;
  }
  .ann-subject {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400;
    color: var(--text); line-height: 1.2; flex: 1; min-width: 0;
  }
  .ann-badge {
    flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 4px 10px;
    border-radius: 20px; border: 0.5px solid var(--border-gold);
    background: var(--gold-dim); color: var(--gold);
    white-space: nowrap; align-self: flex-start; margin-top: 4px;
  }

  .ann-meta { font-size: 13px; color: var(--text-dim); margin-bottom: 1rem; }

  .ann-body {
    font-size: 14px; color: var(--text-muted); line-height: 1.7;
    font-weight: 300; word-break: break-word;
  }
  .ann-body p { margin-bottom: 0.6em; }
  .ann-body p:last-child { margin-bottom: 0; }
  .ann-body a { color: var(--gold); text-decoration: underline; }
  .ann-body ul, .ann-body ol { padding-left: 1.4em; margin-bottom: 0.6em; }
  .ann-body li { margin-bottom: 0.2em; }
  .ann-body strong { font-weight: 600; color: var(--text); }
  .ann-body em { font-style: italic; }

  .ann-empty {
    text-align: center; padding: 4rem 1rem;
    font-size: 14px; color: var(--text-dim); font-style: italic;
  }

  @media (max-width: 600px) {
    .main { padding: 2rem 1.25rem; }
    .ann-card-header { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <main class="main">
    <a href="/app/dashboard.html" class="back-link">Back to dashboard</a>
    <div class="page-eyebrow">From The Performer's Lab</div>
    <div class="page-heading">Announcements</div>
    <div class="page-sub">Messages from The Performer's Lab</div>
    <div class="ann-list" id="ann-list">
      <div class="spinner" style="margin:3rem auto;display:block;"></div>
    </div>
  </main>

  <div id="app-footer"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { initFooter } from './components/footer.js';
  import { applyTheme } from './components/theme.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  const AUDIENCE_LABELS = {
    all: 'All Members',
    founding: 'Founding Members',
    standard: 'Standard Members',
    individual: 'Selected Members',
  };

  function sanitizeHTML(html) {
    const ALLOWED = new Set(['b','i','u','strong','em','a','ul','ol','li','p','br']);
    const doc = new DOMParser().parseFromString(html, 'text/html');
    function clean(node) {
      const toUnwrap = [];
      for (const child of [...node.childNodes]) {
        if (child.nodeType !== Node.ELEMENT_NODE) continue;
        const tag = child.tagName.toLowerCase();
        if (!ALLOWED.has(tag)) { toUnwrap.push(child); continue; }
        for (const attr of [...child.attributes]) {
          if (tag === 'a' && attr.name === 'href' && /^(https?:|\/|#)/.test(attr.value)) continue;
          child.removeAttribute(attr.name);
        }
        clean(child);
      }
      for (const el of toUnwrap) {
        while (el.firstChild) node.insertBefore(el.firstChild, el);
        node.removeChild(el);
      }
    }
    clean(doc.body);
    return doc.body.innerHTML;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric'
    });
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }
    const user = session.user;

    const { data: profile } = await supabase
      .from('profiles').select('display_name, is_admin, theme').eq('user_id', user.id).single();

    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: profile?.display_name || user.email.split('@')[0], isAdmin: profile?.is_admin });
    initSubnav(null, supabase);
    initFooter();

    // Load announcements and user's read state in parallel
    const [{ data: announcements }, { data: reads }] = await Promise.all([
      supabase.from('announcements').select('id, subject, body, audience, sent_at').order('sent_at', { ascending: false }),
      supabase.from('announcement_reads').select('announcement_id').eq('user_id', user.id),
    ]);

    const readSet = new Set((reads || []).map(r => r.announcement_id));
    const list = announcements || [];

    render(list, readSet);

    // Mark unread as read (upsert, fire-and-forget)
    const unreadIds = list.filter(a => !readSet.has(a.id)).map(a => a.id);
    if (unreadIds.length > 0) {
      supabase.from('announcement_reads').upsert(
        unreadIds.map(id => ({ announcement_id: id, user_id: user.id, read_at: new Date().toISOString() })),
        { onConflict: 'announcement_id,user_id', ignoreDuplicates: true }
      ).then(() => {
        // Update card styling to read state
        unreadIds.forEach(id => {
          const card = document.getElementById(`ann-${id}`);
          if (card) card.classList.remove('unread');
        });
      });
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  function render(announcements, readSet) {
    const list = document.getElementById('ann-list');
    if (!announcements.length) {
      list.innerHTML = '<div class="ann-empty">No announcements yet.</div>';
      return;
    }

    list.innerHTML = announcements.map(a => {
      const isUnread = !readSet.has(a.id);
      const badgeLabel = AUDIENCE_LABELS[a.audience] || 'Members';
      return `
        <div class="ann-card${isUnread ? ' unread' : ''}" id="ann-${escapeHtml(a.id)}">
          <div class="ann-card-header">
            <div class="ann-subject">${escapeHtml(a.subject)}</div>
            <span class="ann-badge">${escapeHtml(badgeLabel)}</span>
          </div>
          <div class="ann-meta">${escapeHtml(formatDate(a.sent_at))}</div>
          <div class="ann-body">${sanitizeHTML(a.body)}</div>
        </div>`;
    }).join('');
  }

  init();
</script>
</body>
</html>
