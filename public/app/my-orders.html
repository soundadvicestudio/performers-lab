<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
    --green: #4caf84; --green-dim: rgba(76,175,132,0.12);
    --red: #e05c5c; --red-dim: rgba(224,92,92,0.1);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .main { max-width: 780px; margin: 0 auto; padding: 3rem 2rem 5rem; }
  .page-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.75rem; }
  .page-heading { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 400; color: var(--text); line-height: 1.1; margin-bottom: 0.5rem; }
  .page-subheading { font-size: 14px; color: var(--text-muted); font-weight: 300; line-height: 1.7; margin-bottom: 3rem; }

  .section { margin-bottom: 3rem; }
  .section-heading { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; color: var(--text); margin-bottom: 1rem; }

  /* ── QUOTE CARDS ── */
  .quote-card {
    background: var(--bg-2); border: 0.5px solid var(--border-gold);
    border-radius: 6px; padding: 1.5rem; margin-bottom: 1rem;
    position: relative; overflow: hidden;
  }
  .quote-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .quote-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--text); margin-bottom: 0.25rem; }
  .quote-description { font-size: 13px; color: var(--text-muted); font-weight: 300; line-height: 1.65; margin-bottom: 0.75rem; }
  .quote-price { font-size: 22px; font-family: 'Cormorant Garamond', serif; font-weight: 400; color: var(--gold); margin-bottom: 0.5rem; }
  .quote-expiry { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 1.25rem; }
  .quote-expiry.urgent { color: var(--red); }
  .quote-actions { display: flex; gap: 0.75rem; }

  /* ── ORDER CARDS ── */
  .order-card {
    background: var(--bg-2); border: 0.5px solid var(--border);
    border-radius: 6px; padding: 1.5rem; margin-bottom: 0.75rem;
    transition: border-color 0.2s;
  }
  .order-card:hover { border-color: var(--border-mid); }
  .order-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .order-service-name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 400; color: var(--text); margin-bottom: 2px; }
  .order-date { font-size: 12px; color: var(--text-dim); font-weight: 300; }
  .order-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .badge {
    display: inline-flex; align-items: center;
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 2px;
  }
  .badge-pending { background: var(--gold-dim); color: var(--gold); border: 0.5px solid var(--border-gold); }
  .badge-progress { background: rgba(100,149,237,0.15); color: rgba(100,149,237,0.8); border: 0.5px solid rgba(100,149,237,0.3); }
  .badge-fulfilled { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(76,175,132,0.25); }
  .badge-cancelled { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(224,92,92,0.25); }
  .badge-expedited { background: var(--gold-dim); color: var(--gold); border: 0.5px solid var(--border-gold); }
  .badge-q-pending { background: var(--gold-dim); color: var(--gold); border: 0.5px solid var(--border-gold); }
  .badge-q-accepted { background: var(--green-dim); color: var(--green); border: 0.5px solid rgba(76,175,132,0.25); }
  .badge-q-declined { background: rgba(240,237,230,0.05); color: var(--text-dim); border: 0.5px solid var(--border); }
  .badge-q-expired { background: var(--red-dim); color: var(--red); border: 0.5px solid rgba(224,92,92,0.25); }
  .order-detail-row { margin-bottom: 0.5rem; }
  .order-detail-label { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 2px; }
  .order-detail-value { font-size: 13px; color: var(--text-muted); font-weight: 300; line-height: 1.55; word-break: break-word; }
  .order-detail-value a { color: var(--gold); text-decoration: none; }
  .order-detail-value a:hover { text-decoration: underline; }
  .order-deadline { font-size: 12px; color: var(--text-muted); font-weight: 300; }
  .order-details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }

  /* ── BUTTONS ── */
  .btn-gold {
    background: var(--gold); color: #070707;
    border: none; padding: 10px 22px; border-radius: 2px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    font-family: 'Raleway', sans-serif; cursor: pointer; transition: all 0.2s;
    text-decoration: none; display: inline-block;
  }
  .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-outline {
    background: none; color: var(--text-muted);
    border: 0.5px solid var(--border-mid); padding: 9px 20px; border-radius: 2px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    font-family: 'Raleway', sans-serif; cursor: pointer; transition: all 0.2s;
  }
  .btn-outline:hover { border-color: var(--border-gold); color: var(--gold); }
  .btn-outline:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-state { text-align: center; padding: 3rem 1rem; }
  .empty-state p { font-size: 14px; color: var(--text-dim); font-weight: 300; line-height: 1.7; }
  .empty-state a { color: var(--gold); text-decoration: none; }
  .empty-state a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .main { padding: 2rem 1.25rem 5rem; }
    .order-details-grid { grid-template-columns: 1fr; }
    .quote-actions { flex-direction: column; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <main class="main">
    <div class="page-eyebrow">Your Account</div>
    <h1 class="page-heading">My Orders</h1>
    <p class="page-subheading">Track your service orders and custom quotes.</p>

    <!-- Active Quotes -->
    <section class="section" id="quotes-section" style="display:none;">
      <h2 class="section-heading">Quotes Awaiting Your Response</h2>
      <div id="quotes-list"></div>
    </section>

    <!-- Order History -->
    <section class="section">
      <h2 class="section-heading">Order History</h2>
      <div id="orders-list"></div>
    </section>
  </main>

  <div id="app-footer"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { initFooter } from './components/footer.js';
  import { applyTheme } from './components/theme.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true,
    },
  });

  let currentSession = null;

  function formatPrice(cents) {
    const dollars = cents / 100;
    return dollars % 1 === 0 ? '$' + dollars : '$' + dollars.toFixed(2);
  }

  function formatDate(isoString) {
    return new Date(isoString).toLocaleDateString('en-US', {
      month: 'long', day: 'numeric', year: 'numeric',
    });
  }

  function getCountdown(expiresAt) {
    const diff = new Date(expiresAt).getTime() - Date.now();
    if (diff <= 0) return { text: 'Expired', urgent: false };
    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    if (diff < 24 * 60 * 60 * 1000) {
      return { text: `Expires in ${hours}h ${minutes}m`, urgent: true };
    }
    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    return { text: `Expires in ${days} day${days !== 1 ? 's' : ''}`, urgent: false };
  }

  // ── RENDER ACTIVE QUOTE CARD ──
  function renderQuoteCard(quote) {
    const card = document.createElement('div');
    card.className = 'quote-card';
    card.dataset.quoteId = quote.id;

    const countdown = getCountdown(quote.expires_at);
    const isExpired = new Date(quote.expires_at) <= new Date();

    card.innerHTML = `
      <div class="quote-title">${escHtml(quote.title)}</div>
      <p class="quote-description">${escHtml(quote.description)}</p>
      <div class="quote-price">${formatPrice(quote.price)}</div>
      <div class="quote-expiry${countdown.urgent ? ' urgent' : ''}">${countdown.text}</div>
      ${!isExpired ? `
        <div class="quote-actions">
          <button class="btn-gold" id="accept-${quote.id}">Accept &amp; Pay →</button>
          <button class="btn-outline" id="decline-${quote.id}">Decline</button>
        </div>
        <div id="quote-err-${quote.id}" style="font-size:12px;color:var(--red);margin-top:0.5rem;min-height:16px;"></div>
      ` : `<p style="font-size:13px;color:var(--text-dim);font-weight:300;margin-top:0.25rem;">This quote has expired.</p>`}
    `;

    if (!isExpired) {
      card.querySelector(`#accept-${quote.id}`).addEventListener('click', () => acceptQuote(quote.id));
      card.querySelector(`#decline-${quote.id}`).addEventListener('click', () => declineQuote(quote.id));
    }

    return card;
  }

  async function acceptQuote(quoteId) {
    const btn = document.getElementById(`accept-${quoteId}`);
    const errEl = document.getElementById(`quote-err-${quoteId}`);
    btn.disabled = true;
    btn.textContent = 'Redirecting…';
    errEl.textContent = '';

    try {
      const res = await fetch('/api/services/createQuote', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`,
        },
        body: JSON.stringify({ action: 'checkout', quoteId }),
      });
      const data = await res.json();
      if (!res.ok) {
        errEl.textContent = data.error || 'Could not start checkout. Please try again.';
        btn.disabled = false;
        btn.textContent = 'Accept & Pay →';
        return;
      }
      window.location.href = data.url;
    } catch {
      errEl.textContent = 'Connection error. Please try again.';
      btn.disabled = false;
      btn.textContent = 'Accept & Pay →';
    }
  }

  async function declineQuote(quoteId) {
    const btn = document.getElementById(`decline-${quoteId}`);
    btn.disabled = true;
    btn.textContent = 'Declining…';

    const { error } = await supabase
      .from('service_quotes')
      .update({ status: 'declined' })
      .eq('id', quoteId);

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Decline';
      return;
    }

    const card = document.querySelector(`[data-quote-id="${quoteId}"]`);
    if (card) card.remove();

    const quotesList = document.getElementById('quotes-list');
    if (quotesList && !quotesList.querySelector('.quote-card')) {
      document.getElementById('quotes-section').style.display = 'none';
    }

    showToast('Quote declined.');
  }

  // ── RENDER ORDER CARD ──
  async function renderOrderCard(order, service) {
    const card = document.createElement('div');
    card.className = 'order-card';

    const turnaroundDays = service?.turnaround_days || 7;
    const turnaroundLabel = order.expedited ? `Expedited (4-day)` : `Standard (${turnaroundDays}-day)`;
    const deadline = new Date(new Date(order.created_at).getTime() + turnaroundDays * 24 * 3600 * 1000);
    const deadlineStr = deadline.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

    let statusBadge = '';
    if (order.status === 'pending_approval') statusBadge = `<span class="badge badge-pending">Pending Review</span>`;
    else if (order.status === 'in_progress') statusBadge = `<span class="badge badge-progress">In Progress</span>`;
    else if (order.status === 'fulfilled') statusBadge = `<span class="badge badge-fulfilled">Fulfilled</span>`;
    else if (order.status === 'cancelled') statusBadge = `<span class="badge badge-cancelled">Cancelled</span>`;

    if (order.status === 'fulfilled') {
      // Get delivery info
      const { data: deliveries } = await supabase
        .from('service_deliveries')
        .select('file_url, file_name')
        .eq('order_id', order.id)
        .limit(1)
        .maybeSingle();

      let downloadHtml = '';
      if (deliveries?.file_url) {
        const { data: signedData } = await supabase.storage
          .from('service-deliveries')
          .createSignedUrl(deliveries.file_url, 604800);
        if (signedData?.signedUrl) {
          downloadHtml = `<a href="${signedData.signedUrl}" class="btn-gold" download="${escHtml(deliveries.file_name || 'download')}">Download Your File ↓</a>`;
        }
      }

      card.innerHTML = `
        <div class="order-card-header">
          <div>
            <div class="order-service-name">${escHtml(service?.name || 'Service')}</div>
            <div class="order-date">${formatDate(order.created_at)}</div>
          </div>
          <div>${statusBadge}</div>
        </div>
        ${downloadHtml ? `<div style="margin-top:0.25rem;">${downloadHtml}</div>` : `<p style="font-size:13px;color:var(--text-dim);font-weight:300;">Delivery file not yet available.</p>`}
      `;
      return card;
    }

    if (order.status === 'cancelled') {
      card.innerHTML = `
        <div class="order-card-header">
          <div>
            <div class="order-service-name">${escHtml(service?.name || 'Service')}</div>
            <div class="order-date">${formatDate(order.created_at)}</div>
          </div>
          <div>${statusBadge}</div>
        </div>
      `;
      return card;
    }

    // pending_approval or in_progress
    const detailRows = [];
    if (order.expedited) detailRows.push(`<span class="badge badge-expedited">Expedited</span>`);
    if (order.notes) detailRows.push(`
      <div class="order-detail-row">
        <div class="order-detail-label">Notes Submitted</div>
        <div class="order-detail-value">${escHtml(order.notes)}</div>
      </div>`);
    if (order.reference_file_url) detailRows.push(`
      <div class="order-detail-row">
        <div class="order-detail-label">Reference File</div>
        <div class="order-detail-value" style="font-size:12px;color:var(--text-dim);">File submitted ✓</div>
      </div>`);
    if (order.reference_drive_url) detailRows.push(`
      <div class="order-detail-row">
        <div class="order-detail-label">Reference Link</div>
        <div class="order-detail-value"><a href="${escHtml(order.reference_drive_url)}" target="_blank" rel="noopener">View Link ↗</a></div>
      </div>`);

    card.innerHTML = `
      <div class="order-card-header">
        <div>
          <div class="order-service-name">${escHtml(service?.name || 'Service')}</div>
          <div class="order-date">${formatDate(order.created_at)}</div>
        </div>
        <div class="order-badges">${statusBadge}</div>
      </div>
      ${detailRows.length ? `<div style="margin-bottom:0.75rem;">${detailRows.join('')}</div>` : ''}
      <div class="order-deadline">Due by ${deadlineStr} · ${turnaroundLabel}</div>
    `;
    return card;
  }

  // ── RENDER QUOTE HISTORY ROW ──
  function renderQuoteHistoryCard(quote) {
    const card = document.createElement('div');
    card.className = 'order-card';

    let badge = '';
    if (quote.status === 'declined') badge = `<span class="badge badge-q-declined">Declined</span>`;
    else if (quote.status === 'expired') badge = `<span class="badge badge-q-expired">Expired</span>`;

    card.innerHTML = `
      <div class="order-card-header">
        <div>
          <div class="order-service-name">${escHtml(quote.title)}</div>
          <div class="order-date">${formatDate(quote.created_at)}</div>
        </div>
        <div>${badge}</div>
      </div>
    `;
    return card;
  }

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let toastTimer = null;
  function showToast(msg) {
    let toast = document.getElementById('orders-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'orders-toast';
      toast.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:var(--bg-3);border:0.5px solid var(--border-gold);color:var(--text);padding:12px 20px;border-radius:4px;font-size:13px;font-weight:500;transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:1000;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    requestAnimationFrame(() => {
      toast.style.transform = 'translateY(0)';
      toast.style.opacity = '1';
    });
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.style.transform = 'translateY(80px)';
      toast.style.opacity = '0';
    }, 3000);
  }

  // ── INIT ──
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }

    currentSession = session;
    const userId = session.user.id;

    const { data: profile } = await supabase
      .from('profiles')
      .select('display_name, is_admin, theme')
      .eq('user_id', userId)
      .single();

    const name = profile?.display_name || session.user.email.split('@')[0];
    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: name, isAdmin: profile?.is_admin });
    initSubnav(null, supabase);

    // Fetch data in parallel
    const [ordersRes, quotesRes] = await Promise.all([
      supabase.from('service_orders').select('*').eq('member_id', userId).order('created_at', { ascending: false }),
      supabase.from('service_quotes').select('*').eq('member_id', userId).order('created_at', { ascending: false }),
    ]);

    const orders = ordersRes.data || [];
    const quotes = quotesRes.data || [];

    // Fetch services for orders
    const serviceIds = [...new Set(orders.map(o => o.service_id).filter(Boolean))];
    let serviceMap = {};
    if (serviceIds.length) {
      const { data: services } = await supabase
        .from('services')
        .select('id, name, turnaround_days, type')
        .in('id', serviceIds);
      (services || []).forEach(s => { serviceMap[s.id] = s; });
    }

    // ── Active quotes ──
    const activeQuotes = quotes.filter(q =>
      q.status === 'pending' && new Date(q.expires_at) > new Date()
    );
    if (activeQuotes.length) {
      const quotesSection = document.getElementById('quotes-section');
      quotesSection.style.display = 'block';
      const quotesList = document.getElementById('quotes-list');
      activeQuotes.forEach(q => quotesList.appendChild(renderQuoteCard(q)));
    }

    // ── Order history ──
    const ordersList = document.getElementById('orders-list');

    if (!orders.length && !quotes.filter(q => q.status === 'declined' || q.status === 'expired').length) {
      ordersList.innerHTML = `
        <div class="empty-state">
          <p>No orders yet.<br><a href="/app/services.html">Browse Member Services</a> to get started.</p>
        </div>
      `;
    } else {
      for (const order of orders) {
        const card = await renderOrderCard(order, serviceMap[order.service_id]);
        ordersList.appendChild(card);
      }

      // Declined and expired quotes
      const pastQuotes = quotes.filter(q => q.status === 'declined' || q.status === 'expired');
      pastQuotes.forEach(q => ordersList.appendChild(renderQuoteHistoryCard(q)));
    }

    initFooter();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  init();
</script>
</body>
</html>
