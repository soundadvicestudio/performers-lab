<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Membership Inactive — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
    --green: #4caf84; --green-dim: rgba(76,175,132,0.12);
    --red: #e05c5c; --red-dim: rgba(224,92,92,0.1);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── GATE ── */
  .main {
    max-width: 900px; margin: 0 auto; padding: 3rem 2rem;
    min-height: calc(100vh - 98px);
    display: flex; align-items: center; justify-content: center;
  }
  .gate-wrap {
    max-width: 460px; width: 100%; text-align: center;
  }
  .gate-logo {
    font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400;
    color: var(--text); letter-spacing: 0.05em; margin-bottom: 2rem;
  }
  .gate-logo span { color: var(--gold); }
  .status-badge {
    display: inline-flex; align-items: center;
    background: var(--green-dim); color: var(--green);
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 5px 13px; border-radius: 2px; border: 0.5px solid rgba(76,175,132,0.25);
    margin-bottom: 1.75rem;
  }
  .status-badge.pending { background: var(--gold-dim); color: var(--gold); border-color: var(--border-gold); }
  .status-badge.cancelled { background: var(--red-dim); color: var(--red); border-color: rgba(224,92,92,0.25); }
  .gate-heading {
    font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 400;
    color: var(--text); line-height: 1.15; margin-bottom: 1rem;
  }
  .gate-body {
    font-size: 14px; color: var(--text-muted); line-height: 1.75; font-weight: 300;
    margin-bottom: 2.5rem;
  }
  .btn-gold {
    display: inline-block; background: var(--gold); color: #070707;
    border: none; padding: 13px 32px; border-radius: 2px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer; font-family: 'Raleway', sans-serif; transition: all 0.2s; text-decoration: none;
    margin-bottom: 1.5rem;
  }
  .btn-gold:hover { background: var(--gold-light); transform: translateY(-1px); }
  .gate-contact {
    display: block; font-size: 12px; color: var(--text-dim); text-decoration: none;
    font-weight: 500; letter-spacing: 0.06em; transition: color 0.2s;
  }
  .gate-contact:hover { color: var(--text-muted); }

  @media (max-width: 600px) {
    .main { padding: 2rem 1.25rem; align-items: flex-start; padding-top: 4rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <main class="main">
    <div class="gate-wrap">
      <div class="gate-logo">The Performer's <span>Lab</span></div>
      <div class="status-badge pending" id="gate-status-badge">Inactive</div>
      <h1 class="gate-heading">Your membership is inactive</h1>
      <p class="gate-body">Your subscription is no longer active. Reactivate to regain full access to weekly feedback, the community, live sessions, and the resource library.</p>
      <a href="/app/checkout.html" class="btn-gold">Reactivate membership</a>
      <a href="https://www.alittlesoundadvice.com/contact" class="gate-contact" target="_blank" rel="noopener">Contact us</a>
    </div>
  </main>

  <div id="app-footer"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { initFooter } from './components/footer.js';
  import { applyTheme } from './components/theme.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }

    const user = session.user;

    const [profileRes, membershipRes] = await Promise.all([
      supabase.from('profiles').select('display_name, is_admin, theme').eq('user_id', user.id).single(),
      supabase.from('memberships').select('plan, status').eq('user_id', user.id).single(),
    ]);

    const profile = profileRes.data;
    const membership = membershipRes.data;

    // cancelling = active access until period end; redirect away from gate
    if (membership?.status === 'active' || membership?.status === 'cancelling') {
      window.location.href = '/app/dashboard.html';
      return;
    }

    const name = profile?.display_name || user.email.split('@')[0];
    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: name, isAdmin: profile?.is_admin });
    initSubnav(null);

    const badge = document.getElementById('gate-status-badge');
    const status = membership?.status;
    if (status === 'cancelled') {
      badge.textContent = 'Cancelled';
      badge.className = 'status-badge cancelled';
    } else if (status === 'past_due') {
      badge.textContent = 'Past Due';
      badge.className = 'status-badge pending';
    } else if (status === 'trialing') {
      badge.textContent = 'Trial Ended';
      badge.className = 'status-badge pending';
    } else {
      badge.textContent = 'No Membership';
      badge.className = 'status-badge pending';
    }

    initFooter();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  init();
</script>
</body>
</html>
