<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MAIN ── */
  .main { max-width: 680px; margin: 0 auto; padding: 3rem 2rem; }

  .page-eyebrow { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-bottom: 0.75rem; }

  /* ── HEADING ROW ── */
  .page-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 2rem;
  }
  .page-heading { font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 400; color: var(--text); line-height: 1.1; }
  .clear-all-btn {
    background: none; border: none; cursor: pointer; padding: 0;
    font-size: 13px; color: var(--text-muted); font-family: 'Raleway', sans-serif;
    font-weight: 400; transition: color 0.15s;
  }
  .clear-all-btn:hover { color: var(--text); }

  /* ── NOTIFICATION LIST ── */
  .notif-list { display: flex; flex-direction: column; gap: 2px; }

  .notif-row {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px;
    border-left: 3px solid transparent;
    background: var(--bg-2);
    border-radius: 0 6px 6px 0;
    cursor: default;
    transition: border-color 0.15s, background 0.15s, opacity 0.2s, height 0.2s, padding 0.2s, margin 0.2s;
    overflow: hidden;
  }
  .notif-row.unread {
    border-left-color: var(--gold);
    background: var(--bg-3);
  }
  .notif-row.clickable { cursor: pointer; }
  .notif-row.clickable:hover { border-left-color: var(--gold); }

  .notif-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); flex-shrink: 0; margin-top: 5px;
    opacity: 0; transition: opacity 0.2s;
  }
  .notif-row.unread .notif-dot { opacity: 1; }

  .notif-content { flex: 1; min-width: 0; }
  .notif-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 3px; line-height: 1.4; }
  .notif-body { font-size: 13px; color: var(--text-muted); font-weight: 300; line-height: 1.5; margin-bottom: 5px; }
  .notif-time { font-size: 11px; color: var(--text-dim); font-weight: 400; }

  .notif-dismiss {
    background: none; border: none; cursor: pointer; padding: 2px 4px;
    font-size: 16px; color: var(--text-dim); line-height: 1;
    flex-shrink: 0; transition: color 0.15s; align-self: flex-start;
    font-family: 'Raleway', sans-serif; margin-top: -2px;
  }
  .notif-dismiss:hover { color: var(--text); }

  /* ── EMPTY STATE ── */
  .notif-empty {
    text-align: center; padding: 4rem 1rem;
    font-size: 14px; color: var(--text-dim);
  }

  @media (max-width: 600px) {
    .main { padding: 2rem 1.25rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <main class="main">
    <div class="page-eyebrow">Your Account</div>
    <div class="page-header">
      <div class="page-heading">Notifications</div>
      <button class="clear-all-btn" id="clear-all-btn" style="display:none;">Clear all</button>
    </div>
    <div class="notif-list" id="notif-list">
      <div class="spinner" style="margin: 3rem auto; display: block;"></div>
    </div>
  </main>

  <div id="app-footer"></div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { initFooter } from './components/footer.js';
  import { applyTheme } from './components/theme.js';
  import { relativeTime, startRelativeTimers } from './utils/time.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  let currentUserId = null;

  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }

    currentUserId = session.user.id;

    const { data: profile } = await supabase
      .from('profiles')
      .select('display_name, is_admin, theme')
      .eq('user_id', currentUserId)
      .single();

    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: profile?.display_name || session.user.email.split('@')[0], isAdmin: profile?.is_admin });
    initSubnav(null);
    initFooter();

    // Load notifications
    const { data: notifications } = await supabase
      .from('notifications')
      .select('id, type, title, body, link, read, created_at')
      .eq('user_id', currentUserId)
      .order('created_at', { ascending: false })
      .limit(100);

    renderNotifications(notifications || []);

    // Mark all unread as read (clears bell badge, keeps notifications in list)
    const hasUnread = (notifications || []).some(n => !n.read);
    if (hasUnread) {
      await supabase
        .from('notifications')
        .update({ read: true })
        .eq('user_id', currentUserId)
        .eq('read', false);

      window.dispatchEvent(new CustomEvent('notifications-cleared'));
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }

  function renderNotifications(notifications) {
    const list = document.getElementById('notif-list');
    const clearBtn = document.getElementById('clear-all-btn');

    if (!notifications.length) {
      list.innerHTML = '<div class="notif-empty">No notifications</div>';
      clearBtn.style.display = 'none';
      return;
    }

    clearBtn.style.display = 'block';

    list.innerHTML = notifications.map(n => {
      const unread = !n.read;
      const hasLink = !!n.link;
      const classes = ['notif-row', unread ? 'unread' : '', hasLink ? 'clickable' : ''].filter(Boolean).join(' ');
      const attrs = hasLink ? `role="link" tabindex="0" data-link="${escapeHtml(n.link)}"` : '';

      return `
        <div class="${classes}" ${attrs} data-notif-id="${escapeHtml(n.id)}">
          <div class="notif-dot"></div>
          <div class="notif-content">
            <div class="notif-title">${escapeHtml(n.title || '')}</div>
            ${n.body ? `<div class="notif-body">${escapeHtml(n.body)}</div>` : ''}
            <div class="notif-time" data-timestamp="${escapeHtml(n.created_at)}">${relativeTime(n.created_at)}</div>
          </div>
          <button class="notif-dismiss" data-notif-id="${escapeHtml(n.id)}" aria-label="Dismiss" title="Dismiss">×</button>
        </div>
      `;
    }).join('');

    // Click handler for navigation
    list.querySelectorAll('.notif-row.clickable').forEach(row => {
      row.addEventListener('click', e => {
        if (e.target.classList.contains('notif-dismiss')) return;
        window.location.href = row.dataset.link;
      });
      row.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          if (e.target.classList.contains('notif-dismiss')) return;
          window.location.href = row.dataset.link;
        }
      });
    });

    // Dismiss buttons
    list.querySelectorAll('.notif-dismiss').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const notifId = btn.dataset.notifId;
        const card = btn.closest('.notif-row');
        dismissNotification(notifId, card);
      });
    });

    // Clear all
    clearBtn.addEventListener('click', clearAllNotifications);

    startRelativeTimers();
  }

  function dismissNotification(notifId, cardEl) {
    // Animate out
    const h = cardEl.offsetHeight;
    cardEl.style.height = h + 'px';
    cardEl.offsetHeight; // force reflow
    cardEl.style.opacity = '0';
    cardEl.style.height = '0';
    cardEl.style.paddingTop = '0';
    cardEl.style.paddingBottom = '0';
    cardEl.style.marginTop = '0';
    cardEl.style.marginBottom = '0';

    // Delete from DB (fire and forget)
    supabase.from('notifications').delete().eq('id', notifId);

    setTimeout(() => {
      cardEl.remove();
      checkEmptyState();
    }, 200);
  }

  async function clearAllNotifications() {
    const list = document.getElementById('notif-list');
    const clearBtn = document.getElementById('clear-all-btn');

    // Remove all cards from DOM immediately
    list.innerHTML = '<div class="notif-empty">No notifications</div>';
    clearBtn.style.display = 'none';

    // Delete from DB
    await supabase
      .from('notifications')
      .delete()
      .eq('user_id', currentUserId);

    // Zero the bell badge
    window.dispatchEvent(new CustomEvent('notifications-cleared'));
  }

  function checkEmptyState() {
    const list = document.getElementById('notif-list');
    const clearBtn = document.getElementById('clear-all-btn');
    const remaining = list.querySelectorAll('.notif-row');
    if (!remaining.length) {
      list.innerHTML = '<div class="notif-empty">No notifications</div>';
      clearBtn.style.display = 'none';
    }
  }

  init();
</script>
</body>
</html>
