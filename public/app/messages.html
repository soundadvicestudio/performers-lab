<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — The Performer's Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a96e; --gold-light: #d4b87e;
    --gold-dim: rgba(201,169,110,0.14); --border-gold: rgba(201,169,110,0.28);
    --bg: #070707; --bg-2: #0d0d0d; --bg-3: #131313; --bg-4: #181818;
    --text: #f0ede6; --text-muted: rgba(240,237,230,0.58); --text-dim: rgba(240,237,230,0.28);
    --border: rgba(240,237,230,0.08); --border-mid: rgba(240,237,230,0.14);
  }
  html, body { height: 100%; }
  body { font-family: 'Raleway', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow: hidden; }

  /* ── LOADING ── */
  #loading {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .loading-inner { text-align: center; }
  .loading-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; color: var(--text); letter-spacing: 0.05em; margin-bottom: 1.5rem; }
  .loading-logo span { color: var(--gold); }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(201,169,110,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100vh; }
  .messages-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    border-left: 0.5px solid var(--border);
    border-right: 0.5px solid var(--border);
  }

  /* ── CONVERSATION PANEL ── */
  .conv-panel {
    width: 280px; flex-shrink: 0;
    border-right: 0.5px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .conv-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 0.5px solid var(--border);
    flex-shrink: 0;
  }
  .conv-panel-title {
    font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text);
  }
  .btn-new-msg {
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--gold); border: 0.5px solid var(--border-gold);
    background: none; padding: 5px 10px; border-radius: 2px;
    cursor: pointer; font-family: 'Raleway', sans-serif; transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-new-msg:hover { background: var(--gold-dim); }

  .conv-list { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

  .conv-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
    border-bottom: 0.5px solid var(--border);
  }
  .conv-item:hover { background: rgba(240,237,230,0.03); }
  .conv-item.active { border-left-color: var(--gold); background: var(--gold-dim); }

  .conv-avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: var(--gold); overflow: hidden;
    font-family: 'Raleway', sans-serif;
  }
  .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .conv-preview {
    font-size: 12px; color: var(--text-dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  .conv-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
  .conv-time { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
  .conv-unread-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--gold);
  }

  .conv-empty {
    padding: 2rem 1rem; text-align: center;
    font-size: 13px; color: var(--text-dim); font-style: italic; line-height: 1.6;
  }

  /* ── THREAD PANEL ── */
  .thread-panel {
    flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg);
  }

  .thread-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--text-dim); font-style: italic;
    text-align: center; padding: 2rem;
  }

  .thread-container {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }

  .thread-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-bottom: 0.5px solid var(--border);
    flex-shrink: 0; background: var(--bg-2);
  }
  .thread-back {
    display: none; background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 18px; padding: 0; transition: color 0.2s;
    font-family: 'Raleway', sans-serif; line-height: 1;
  }
  .thread-back:hover { color: var(--gold); }
  .thread-header-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--gold); overflow: hidden;
  }
  .thread-header-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .thread-header-name {
    font-size: 14px; font-weight: 600; color: var(--text); text-decoration: none;
    transition: color 0.2s;
  }
  .thread-header-name:hover { color: var(--gold); }

  /* ── MESSAGES ── */
  .thread-messages {
    flex: 1; overflow-y: auto; padding: 1rem 16px;
    display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }

  .msg-group { display: flex; align-items: flex-end; gap: 8px; }
  .msg-group.mine { flex-direction: row-reverse; }

  .msg-sender-avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; color: var(--gold); overflow: hidden;
    align-self: flex-end;
  }
  .msg-sender-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .msg-group.mine .msg-sender-avatar { display: none; }

  .msg-bubble-wrap { max-width: 65%; display: flex; flex-direction: column; }
  .msg-group.mine .msg-bubble-wrap { align-items: flex-end; }

  .msg-bubble {
    padding: 9px 13px; font-size: 14px; line-height: 1.55;
    word-break: break-word; white-space: pre-wrap;
  }
  .msg-group.mine .msg-bubble {
    background: var(--gold-dim); border: 0.5px solid var(--border-gold);
    border-radius: 12px 12px 4px 12px; color: var(--text);
  }
  .msg-group.other .msg-bubble {
    background: var(--bg-3); border: 0.5px solid var(--border);
    border-radius: 12px 12px 12px 4px; color: var(--text);
  }
  .msg-time {
    font-size: 10px; color: var(--text-dim); margin-top: 3px;
    padding: 0 2px;
  }

  .thread-messages-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: var(--text-dim); font-style: italic;
  }

  /* ── MESSAGE INPUT ── */
  .thread-input-bar {
    display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 16px; border-top: 0.5px solid var(--border);
    flex-shrink: 0; background: var(--bg-2);
  }
  .msg-textarea {
    flex: 1; background: var(--bg-3); border: 0.5px solid var(--border-mid);
    border-radius: 6px; padding: 9px 12px;
    font-size: 14px; color: var(--text); font-family: 'Raleway', sans-serif;
    resize: none; line-height: 1.5; max-height: 96px; overflow-y: auto;
    transition: border-color 0.2s;
  }
  .msg-textarea:focus { outline: none; border-color: var(--border-gold); }
  .msg-textarea::placeholder { color: var(--text-dim); }
  .btn-send {
    background: var(--gold); color: var(--bg); border: none;
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn-send:hover:not(:disabled) { background: var(--gold-light); }
  .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-send svg { width: 16px; height: 16px; }

  /* ── MEMBER SEARCH MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.78);
    display: flex; align-items: center; justify-content: center;
    z-index: 500; padding: 1rem;
  }
  .modal-card {
    background: var(--bg-2); border: 0.5px solid var(--border-gold);
    border-radius: 12px; padding: 20px;
    width: 100%; max-width: 400px; max-height: 80vh;
    display: flex; flex-direction: column;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .modal-title {
    font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--text);
  }
  .modal-close {
    background: none; border: none; cursor: pointer; font-size: 20px;
    color: var(--text-dim); line-height: 1; padding: 0; transition: color 0.2s;
    font-family: 'Raleway', sans-serif;
  }
  .modal-close:hover { color: var(--gold); }
  .search-input {
    width: 100%; background: var(--bg-3); border: 0.5px solid var(--border-mid);
    color: var(--text); padding: 10px 13px; border-radius: 4px;
    font-size: 14px; font-family: 'Raleway', sans-serif; font-weight: 300;
    outline: none; transition: border-color 0.2s; margin-bottom: 10px;
  }
  .search-input:focus { border-color: var(--border-gold); }
  .search-results { overflow-y: auto; flex: 1; }
  .search-result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 8px; cursor: pointer; border-radius: 4px;
    transition: background 0.15s;
  }
  .search-result-item:hover { background: rgba(240,237,230,0.05); }
  .search-result-avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-4); border: 0.5px solid var(--border-mid);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: var(--gold); overflow: hidden;
  }
  .search-result-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .search-result-name { font-size: 14px; color: var(--text); font-weight: 400; }
  .search-placeholder { font-size: 13px; color: var(--text-dim); font-style: italic; padding: 8px; text-align: center; }

  /* ── MOBILE ── */
  @media (max-width: 767px) {
    body { overflow: hidden; }
    .messages-layout { position: relative; border: none; }
    .conv-panel {
      position: absolute; inset: 0; width: 100%;
      transform: translateX(0); transition: transform 0.28s ease; z-index: 1;
    }
    .thread-panel {
      position: absolute; inset: 0;
      transform: translateX(100%); transition: transform 0.28s ease; z-index: 2;
    }
    .messages-layout.thread-open .conv-panel { transform: translateX(-100%); }
    .messages-layout.thread-open .thread-panel { transform: translateX(0); }
    .thread-back { display: flex; }
    .thread-empty { display: none; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="loading-inner">
    <div class="loading-logo">The Performer's <span>Lab</span></div>
    <div class="spinner"></div>
  </div>
</div>

<div id="app" style="display:none; flex-direction:column; height:100vh;">
  <div id="app-nav"></div>
  <div id="app-subnav"></div>

  <div class="messages-layout" id="messages-layout">

    <!-- Conversation list -->
    <div class="conv-panel" id="conv-panel">
      <div class="conv-panel-header">
        <div class="conv-panel-title">Messages</div>
        <button class="btn-new-msg" id="btn-new-msg">+ New</button>
      </div>
      <div class="conv-list" id="conv-list">
        <div style="padding:2rem;text-align:center;"><div class="spinner" style="margin:0 auto;"></div></div>
      </div>
    </div>

    <!-- Thread area -->
    <div class="thread-panel" id="thread-panel">
      <div class="thread-empty" id="thread-empty">Select a conversation or start a new one.</div>
      <div class="thread-container" id="thread-container" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
        <div class="thread-header" id="thread-header">
          <button class="thread-back" id="thread-back">←</button>
          <div class="thread-header-avatar" id="thread-header-avatar"></div>
          <a class="thread-header-name" id="thread-header-name" href="#"></a>
        </div>
        <div class="thread-messages" id="thread-messages"></div>
        <div class="thread-input-bar">
          <textarea class="msg-textarea" id="msg-input" rows="1" placeholder="Write a message…"></textarea>
          <button class="btn-send" id="btn-send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Member search modal -->
<div id="search-modal" style="display:none;">
  <div class="modal-overlay" id="search-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">New Message</div>
        <button class="modal-close" id="search-modal-close">×</button>
      </div>
      <input type="text" class="search-input" id="search-input" placeholder="Search members…" autocomplete="off">
      <div class="search-results" id="search-results">
        <div class="search-placeholder">Start typing to find members.</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  import { initNav } from './components/nav.js';
  import { initSubnav } from './components/subnav.js';
  import { applyTheme } from './components/theme.js';
  import { relativeTime } from './utils/time.js';

  const SUPABASE_URL  = 'https://gunkzxyefspmvytiwcwy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1bmt6eHllZnNwbXZ5dGl3Y3d5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNjEyOTUsImV4cCI6MjA5NTczNzI5NX0.xv3Hkk_oWHBMVLKYn2PQ7x7GItUmoFgNH2bPoXGLHdg';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      storageKey: 'sb-performers-lab-auth',
      storage: window.localStorage,
      autoRefreshToken: true,
      persistSession: true,
      detectSessionInUrl: true
    }
  });

  // ── State ────────────────────────────────────────────────────────────
  let currentUser = null;
  let currentUserDisplayName = '';
  let conversations = [];
  let convProfiles = {}; // otherUserId → profile
  let activeConvId = null;
  let realtimeChannel = null;
  let myConvIds = new Set();

  // ── Helpers ─────────────────────────────────────────────────────────
  function escapeHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function getInitial(name) { return String(name || '?').charAt(0).toUpperCase(); }

  const timeAgo = relativeTime;

  function avatarHtml(photoUrl, name, size = 36) {
    const s = `width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px;`;
    if (photoUrl) return `<div class="conv-avatar" style="${s}"><img src="${escapeHtml(photoUrl)}" alt="${escapeHtml(name)}" loading="lazy"></div>`;
    return `<div class="conv-avatar" style="${s}">${escapeHtml(getInitial(name))}</div>`;
  }

  function otherParticipantId(conv) {
    return conv.participant_1_id === currentUser.id ? conv.participant_2_id : conv.participant_1_id;
  }

  function isProfileComplete(profile) {
    return !!(
      profile?.display_name?.trim() &&
      profile?.birth_year &&
      profile?.experience?.trim() &&
      profile?.location?.trim() &&
      profile?.bio?.trim()
    );
  }

  // ── Init ─────────────────────────────────────────────────────────────
  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { window.location.href = '/app/login.html'; return; }
    currentUser = session.user;

    const [{ data: profile }, { data: membership }] = await Promise.all([
      supabase.from('profiles').select('display_name, is_admin, theme, bio, location, birth_year, experience').eq('user_id', currentUser.id).single(),
      supabase.from('memberships').select('status').eq('user_id', currentUser.id).single(),
    ]);

    if (!profile?.is_admin && !isProfileComplete(profile)) {
      window.location.href = '/app/profile.html?onboarding=true';
      return;
    }

    const hasAccess = profile?.is_admin
      || membership?.status === 'active'
      || membership?.status === 'cancelling';

    if (!hasAccess) { window.location.href = '/app/gate.html'; return; }

    currentUserDisplayName = profile?.display_name || currentUser.email.split('@')[0];
    applyTheme(profile?.theme || 'gold');
    initNav(supabase, { userName: currentUserDisplayName, isAdmin: profile?.is_admin });
    initSubnav('Messages');

    await loadConversations();
    initSearch();
    initMessageInput();

    document.getElementById('thread-back').addEventListener('click', () => {
      document.getElementById('messages-layout').classList.remove('thread-open');
    });

    // Auto-open from URL param
    const params = new URLSearchParams(window.location.search);
    const convParam = params.get('conversation');
    if (convParam) {
      const target = conversations.find(c => c.id === convParam);
      if (target) openConversation(target);
    }

    subscribeRealtime();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }

  // ── Load conversations ────────────────────────────────────────────────
  async function loadConversations() {
    const { data: convs } = await supabase
      .from('conversations')
      .select('id, participant_1_id, participant_2_id, created_at')
      .or(`participant_1_id.eq.${currentUser.id},participant_2_id.eq.${currentUser.id}`);

    conversations = convs || [];
    myConvIds = new Set(conversations.map(c => c.id));

    if (!conversations.length) {
      document.getElementById('conv-list').innerHTML = `
        <div class="conv-empty">No conversations yet.<br>Send someone a message!</div>`;
      return;
    }

    const otherIds = [...new Set(conversations.map(otherParticipantId))];

    // Batch fetch profiles + recent messages in parallel
    const [{ data: profiles }, { data: allMessages }] = await Promise.all([
      supabase.from('profiles').select('user_id, display_name, photo_url').in('user_id', otherIds),
      supabase.from('messages')
        .select('id, conversation_id, sender_id, content, read, created_at')
        .in('conversation_id', conversations.map(c => c.id))
        .order('created_at', { ascending: false }),
    ]);

    convProfiles = {};
    for (const p of (profiles || [])) convProfiles[p.user_id] = p;

    // Last message and unread count per conversation
    const lastMsg = {};
    const unreadCount = {};
    for (const m of (allMessages || [])) {
      if (!lastMsg[m.conversation_id]) lastMsg[m.conversation_id] = m;
      if (!m.read && m.sender_id !== currentUser.id) {
        unreadCount[m.conversation_id] = (unreadCount[m.conversation_id] || 0) + 1;
      }
    }

    // Sort by most recent message
    conversations.sort((a, b) => {
      const am = lastMsg[a.id], bm = lastMsg[b.id];
      if (!am && !bm) return 0;
      if (!am) return 1;
      if (!bm) return -1;
      return new Date(bm.created_at) - new Date(am.created_at);
    });

    renderConvList(lastMsg, unreadCount);
  }

  function renderConvList(lastMsg, unreadCount) {
    const list = document.getElementById('conv-list');

    if (!conversations.length) {
      list.innerHTML = '<div class="conv-empty">No conversations yet.<br>Send someone a message!</div>';
      return;
    }

    list.innerHTML = conversations.map(conv => {
      const otherId = otherParticipantId(conv);
      const prof = convProfiles[otherId] || {};
      const name = prof.display_name || 'Member';
      const lm = lastMsg[conv.id];
      const preview = lm ? (lm.sender_id === currentUser.id ? 'You: ' : '') + lm.content.replace(/\n/g, ' ') : 'No messages yet';
      const unread = (unreadCount && unreadCount[conv.id]) || 0;
      const isActive = conv.id === activeConvId;

      return `
        <div class="conv-item${isActive ? ' active' : ''}" data-conv-id="${escapeHtml(conv.id)}" id="conv-item-${escapeHtml(conv.id)}">
          ${avatarHtml(prof.photo_url, name)}
          <div class="conv-info">
            <div class="conv-name">${escapeHtml(name)}</div>
            <div class="conv-preview">${escapeHtml(preview.substring(0, 80))}</div>
          </div>
          <div class="conv-right">
            <div class="conv-time">${lm ? timeAgo(lm.created_at) : ''}</div>
            ${unread > 0 ? '<div class="conv-unread-dot" id="dot-' + escapeHtml(conv.id) + '"></div>' : '<div id="dot-' + escapeHtml(conv.id) + '" style="display:none;" class="conv-unread-dot"></div>'}
          </div>
        </div>`;
    }).join('');

    list.querySelectorAll('.conv-item').forEach(el => {
      el.addEventListener('click', () => {
        const conv = conversations.find(c => c.id === el.dataset.convId);
        if (conv) openConversation(conv);
      });
    });
  }

  // ── Open conversation ─────────────────────────────────────────────────
  async function openConversation(conv) {
    activeConvId = conv.id;

    // Highlight active in list
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    const activeItem = document.getElementById(`conv-item-${conv.id}`);
    if (activeItem) activeItem.classList.add('active');

    // Mobile: slide to thread
    document.getElementById('messages-layout').classList.add('thread-open');

    // Show thread container
    document.getElementById('thread-empty').style.display = 'none';
    const container = document.getElementById('thread-container');
    container.style.display = 'flex';

    // Update header
    const otherId = otherParticipantId(conv);
    const prof = convProfiles[otherId] || {};
    const name = prof.display_name || 'Member';

    const headerAvatar = document.getElementById('thread-header-avatar');
    if (prof.photo_url) {
      headerAvatar.innerHTML = `<img src="${escapeHtml(prof.photo_url)}" alt="${escapeHtml(name)}" style="width:100%;height:100%;object-fit:cover;">`;
    } else {
      headerAvatar.textContent = getInitial(name);
    }
    const headerName = document.getElementById('thread-header-name');
    headerName.textContent = name;
    headerName.href = `/app/member.html?id=${encodeURIComponent(otherId)}`;

    // Load messages
    await loadMessages(conv.id, prof);

    // Mark unread as read
    markConvRead(conv.id);

    // Update realtime subscription
    subscribeActiveConv(conv.id);
  }

  async function loadMessages(convId, otherProfile) {
    const msgArea = document.getElementById('thread-messages');
    msgArea.innerHTML = '<div style="text-align:center;padding:1rem;"><div class="spinner" style="margin:0 auto;"></div></div>';

    const { data: messages } = await supabase
      .from('messages')
      .select('id, conversation_id, sender_id, content, read, created_at')
      .eq('conversation_id', convId)
      .order('created_at', { ascending: true });

    if (!messages || !messages.length) {
      msgArea.innerHTML = '<div class="thread-messages-empty">No messages yet. Say hello!</div>';
      return;
    }

    msgArea.innerHTML = messages.map(m => renderMessage(m, otherProfile)).join('');
    scrollToBottom();
  }

  function renderMessage(msg, otherProfile) {
    const isMine = msg.sender_id === currentUser.id;
    const prof = isMine ? null : (otherProfile || convProfiles[msg.sender_id] || {});
    const name = prof?.display_name || 'Member';

    return `
      <div class="msg-group ${isMine ? 'mine' : 'other'}">
        ${!isMine ? `
          <div class="msg-sender-avatar">
            ${prof?.photo_url
              ? `<img src="${escapeHtml(prof.photo_url)}" alt="${escapeHtml(name)}" style="width:100%;height:100%;object-fit:cover;">`
              : escapeHtml(getInitial(name))}
          </div>` : ''}
        <div class="msg-bubble-wrap">
          <div class="msg-bubble">${escapeHtml(msg.content)}</div>
          <div class="msg-time">${timeAgo(msg.created_at)}</div>
        </div>
      </div>`;
  }

  function scrollToBottom() {
    const msgArea = document.getElementById('thread-messages');
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  async function markConvRead(convId) {
    await supabase.from('messages').update({ read: true })
      .eq('conversation_id', convId)
      .neq('sender_id', currentUser.id)
      .eq('read', false);

    const dot = document.getElementById(`dot-${convId}`);
    if (dot) dot.style.display = 'none';

    dispatchMsgUnread();
  }

  async function dispatchMsgUnread() {
    const convIds = [...myConvIds];
    if (!convIds.length) {
      window.dispatchEvent(new CustomEvent('messages-cleared'));
      return;
    }
    const { count } = await supabase
      .from('messages')
      .select('id', { count: 'exact', head: true })
      .in('conversation_id', convIds)
      .neq('sender_id', currentUser.id)
      .eq('read', false);

    if ((count || 0) === 0) {
      window.dispatchEvent(new CustomEvent('messages-cleared'));
    } else {
      window.dispatchEvent(new CustomEvent('messages-count-update', { detail: { count } }));
    }
  }

  // ── Send message ──────────────────────────────────────────────────────
  function initMessageInput() {
    const textarea = document.getElementById('msg-input');
    const sendBtn = document.getElementById('btn-send');

    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 96) + 'px';
    });

    textarea.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);
  }

  async function sendMessage() {
    if (!activeConvId) return;
    const textarea = document.getElementById('msg-input');
    const content = (textarea.value || '').trim();
    if (!content) return;

    const btn = document.getElementById('btn-send');
    btn.disabled = true;
    textarea.value = '';
    textarea.style.height = '';

    // Optimistic bubble
    const optimisticMsg = {
      id: 'opt-' + Date.now(),
      conversation_id: activeConvId,
      sender_id: currentUser.id,
      content,
      read: false,
      created_at: new Date().toISOString(),
    };
    appendMessage(optimisticMsg, null);

    const { data: sent, error } = await supabase.from('messages')
      .insert({ conversation_id: activeConvId, sender_id: currentUser.id, content, read: false })
      .select('id, conversation_id, sender_id, content, read, created_at')
      .single();

    btn.disabled = false;

    if (error) {
      // Remove optimistic bubble on failure
      document.getElementById(`msg-${optimisticMsg.id}`)?.remove();
      textarea.value = content;
      return;
    }

    // Replace optimistic bubble with real one
    const optEl = document.getElementById(`msg-${optimisticMsg.id}`);
    if (optEl) optEl.id = `msg-${sent.id}`;

    updateConvPreview(activeConvId, content, sent.created_at);

    // Notify recipient (fire-and-forget — do not block UI)
    const conv = conversations.find(c => c.id === activeConvId);
    if (conv) {
      const recipientId = otherParticipantId(conv);
      const preview = content.substring(0, 80);
      supabase.from('notifications').insert({
        user_id: recipientId,
        type: 'new_dm',
        title: `New message from ${currentUserDisplayName}`,
        body: preview,
        link: `/app/messages.html?conversation=${activeConvId}`,
        read: false,
      }).then(() => {
        fetch('/api/community/notifyDM', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            recipientUserId: recipientId,
            senderName: currentUserDisplayName,
            messagePreview: preview,
            conversationId: activeConvId,
          }),
        }).catch(err => console.error('[notifyDM]', err));
      }).catch(err => console.error('[notification insert]', err));
    }
  }

  function appendMessage(msg, otherProfile) {
    const msgArea = document.getElementById('thread-messages');
    const emptyEl = msgArea.querySelector('.thread-messages-empty');
    if (emptyEl) emptyEl.remove();

    const html = renderMessage(msg, otherProfile);
    const div = document.createElement('div');
    div.innerHTML = html;
    const el = div.firstElementChild;
    if (el) {
      el.id = `msg-${msg.id}`;
      msgArea.appendChild(el);
    }
    scrollToBottom();
  }

  function updateConvPreview(convId, content, timestamp) {
    const item = document.getElementById(`conv-item-${convId}`);
    if (!item) return;
    const previewEl = item.querySelector('.conv-preview');
    const timeEl = item.querySelector('.conv-time');
    if (previewEl) previewEl.textContent = 'You: ' + content.replace(/\n/g, ' ').substring(0, 60);
    if (timeEl) timeEl.textContent = timeAgo(timestamp);
  }

  // ── Realtime ──────────────────────────────────────────────────────────
  let activeConvChannel = null;

  function subscribeRealtime() {
    // Subscribe to all message inserts — filter in JS for conv list unread dots
    supabase.channel('all-msg-inserts')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        payload => {
          const msg = payload.new;
          if (msg.sender_id === currentUser.id) return;
          if (msg.conversation_id === activeConvId) return; // handled by active conv channel
          if (!myConvIds.has(msg.conversation_id)) return;
          // Show unread dot on conv list item
          const dot = document.getElementById(`dot-${msg.conversation_id}`);
          if (dot) dot.style.display = 'block';
          updateConvPreview(msg.conversation_id, msg.content, msg.created_at);
        })
      .subscribe();
  }

  function subscribeActiveConv(convId) {
    if (activeConvChannel) supabase.removeChannel(activeConvChannel);

    const conv = conversations.find(c => c.id === convId);
    const otherId = conv ? otherParticipantId(conv) : null;
    const otherProf = otherId ? (convProfiles[otherId] || {}) : {};

    activeConvChannel = supabase.channel(`conv-${convId}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages',
        filter: `conversation_id=eq.${convId}`,
      }, payload => {
        const msg = payload.new;
        if (msg.sender_id === currentUser.id) return; // already shown optimistically
        appendMessage(msg, otherProf);
        markConvRead(convId);
        updateConvPreview(convId, msg.content, msg.created_at);
      })
      .subscribe();
  }

  // ── Member search modal ───────────────────────────────────────────────
  function initSearch() {
    document.getElementById('btn-new-msg').addEventListener('click', openSearch);
    document.getElementById('search-modal-close').addEventListener('click', closeSearch);
    document.getElementById('search-overlay').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeSearch();
    });

    let debounceTimer = null;
    document.getElementById('search-input').addEventListener('input', e => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => runSearch(e.target.value.trim()), 300);
    });
  }

  function openSearch() {
    document.getElementById('search-modal').style.display = 'block';
    document.getElementById('search-input').value = '';
    document.getElementById('search-results').innerHTML = '<div class="search-placeholder">Start typing to find members.</div>';
    setTimeout(() => document.getElementById('search-input').focus(), 50);
  }

  function closeSearch() {
    document.getElementById('search-modal').style.display = 'none';
  }

  async function runSearch(term) {
    const resultsEl = document.getElementById('search-results');
    if (!term) {
      resultsEl.innerHTML = '<div class="search-placeholder">Start typing to find members.</div>';
      return;
    }

    const { data: results } = await supabase
      .from('profiles')
      .select('user_id, display_name, photo_url')
      .ilike('display_name', `%${term}%`)
      .neq('user_id', currentUser.id)
      .limit(10);

    if (!results || !results.length) {
      resultsEl.innerHTML = '<div class="search-placeholder">No members found.</div>';
      return;
    }

    resultsEl.innerHTML = results.map(p => `
      <div class="search-result-item" data-user-id="${escapeHtml(p.user_id)}">
        ${p.photo_url
          ? `<div class="search-result-avatar"><img src="${escapeHtml(p.photo_url)}" alt="${escapeHtml(p.display_name)}" style="width:100%;height:100%;object-fit:cover;"></div>`
          : `<div class="search-result-avatar">${escapeHtml(getInitial(p.display_name))}</div>`}
        <div class="search-result-name">${escapeHtml(p.display_name || 'Member')}</div>
      </div>
    `).join('');

    // Cache profiles we found (needed for thread rendering)
    for (const p of results) convProfiles[p.user_id] = p;

    resultsEl.querySelectorAll('.search-result-item').forEach(el => {
      el.addEventListener('click', () => startConversationWith(el.dataset.userId));
    });
  }

  async function startConversationWith(otherId) {
    closeSearch();

    // Check for existing conversation
    const existing = conversations.find(c =>
      (c.participant_1_id === currentUser.id && c.participant_2_id === otherId) ||
      (c.participant_1_id === otherId && c.participant_2_id === currentUser.id)
    );

    if (existing) {
      openConversation(existing);
      return;
    }

    // Create new conversation
    const { data: newConv, error } = await supabase
      .from('conversations')
      .insert({ participant_1_id: currentUser.id, participant_2_id: otherId })
      .select('id, participant_1_id, participant_2_id, created_at')
      .single();

    if (error || !newConv) return;

    conversations.unshift(newConv);
    myConvIds.add(newConv.id);

    // Re-render conv list (no messages yet, so lastMsg/unread maps are empty for this conv)
    renderConvList({}, {});

    openConversation(newConv);
  }

  init();
</script>
